<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Splitscreen labels</title>
<style>
  /* Transparent overlay for the OBS Splitscreen scene. Feed A is the left
     half (x 0..960), Feed B the right (x 960..1920); both feeds are a 960x540
     band with their top edge at y=270. Each label sits at the top-right of its
     own feed, flush-right, overhanging slightly above the feed's top edge. */
  html,body{margin:0;width:1920px;height:1080px;background:transparent;overflow:hidden}
  .split-label{position:absolute;top:242px;            /* 270 - 28 overhang */
    background:rgba(38,44,52,.92);border:2px solid #4a5560;border-radius:14px;
    padding:12px 24px;color:#fff;font:600 44px/1.1 'IBM Plex Mono',ui-monospace,monospace;
    letter-spacing:.12em;text-transform:uppercase;box-shadow:0 6px 20px rgba(0,0,0,.55);
    white-space:nowrap}
  #split-left{right:960px}    /* flush to the centre seam */
  #split-right{right:0}       /* flush to the screen edge */
  .split-label[hidden]{display:none}
  /* Each feed carries a legacy screen-sized coordinate plane. At the
     default bounds this is pixel-identical to old viewport-relative labels;
     moving/resizing a feed keeps its label anchored to that feed's top/right.
     Each feed id rule carries its full px box: it is the base the OBS sync merges a
     saved splitscreen.css over (overlay_build.scene_boxes), so a move-only edit
     still yields width/height. */
  .split-feed{position:absolute;width:960px;height:540px;overflow:visible}
  #split-feed-a{left:0px;top:270px;width:960px;height:540px}
  #split-feed-b{left:960px;top:270px;width:960px;height:540px}
  .split-label-plane{position:absolute;top:-270px;right:0;width:1920px;height:1080px;pointer-events:none}
  #split-feed-a .split-label-plane{right:-960px}
  .split-label{pointer-events:auto;z-index:3}
</style>
<link rel="stylesheet" href="/splitscreen/override.css">
</head>
<body>
  <div id="split-feed-a" class="split-feed" data-video="true" data-edit="Feed A video" data-edit-props="left,top,width,height">
    <div class="split-label-plane"><div id="split-left" class="split-label" data-edit="Feed A label" data-edit-props="offsetRight,offsetTop,width,height,padding,background,borderWidth,borderStyle,borderColor,borderRadius,slant,opacity,rotation,shear,visible,fontSize,lineHeight,letterSpacing,fontFamily,fontWeight,fontStyle,color,align,valign,textTransform,textShadow" hidden></div></div>
  </div>
  <div id="split-feed-b" class="split-feed" data-video="true" data-edit="Feed B video" data-edit-props="left,top,width,height">
    <div class="split-label-plane"><div id="split-right" class="split-label" data-edit="Feed B label" data-edit-props="offsetRight,offsetTop,width,height,padding,background,borderWidth,borderStyle,borderColor,borderRadius,slant,opacity,rotation,shear,visible,fontSize,lineHeight,letterSpacing,fontFamily,fontWeight,fontStyle,color,align,valign,textTransform,textShadow" hidden></div></div>
  </div>
<script>
  // Feed A renders on the left box, Feed B on the right. The relay reports which
  // feed is on air; that box reads CURRENT, the other NEXT. NEXT hides when the
  // other feed is inactive (qualifying mode). Server-driven only, no reloads.
  var L = document.getElementById('split-left');
  var R = document.getElementById('split-right');
  async function tick(){
    try{
      var s = await (await fetch('/splitscreen/data', {cache:'no-store'})).json();
      var leftIsCurrent = s.current === 'A';
      L.textContent = leftIsCurrent ? 'Current' : 'Next';
      R.textContent = leftIsCurrent ? 'Next' : 'Current';
      // Hide whichever box would read NEXT when next_active is false.
      L.hidden = (!leftIsCurrent && !s.next_active);
      R.hidden = ( leftIsCurrent && !s.next_active);
    }catch(e){ /* keep last-good labels on a transient relay hiccup */ }
  }
  tick(); setInterval(tick, 2500);
</script>
</body>
</html>
