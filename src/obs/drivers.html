<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Driver dashboard</title>
<style>
  :root {
    --dd-bg: rgba(10, 13, 18, 0.86);
    --dd-row: rgba(255, 255, 255, 0.04);
    --dd-fg: #f2f4f7;
    --dd-dim: #9aa3ad;
    --dd-accent: #e10600;
    --dd-purple: #b26bff;
    --dd-pb: #4fdc74;
    --dd-fuel: #4fdc74;
    --dd-fuel-low: #ffb454;
    --dd-font: "Segoe UI", Roboto, Arial, sans-serif;
  }
  html, body {
    margin: 0; padding: 0; width: 1920px; height: 1080px;
    background: transparent; overflow: hidden; font-family: var(--dd-font); color: var(--dd-fg);
  }
  body[data-hidden] #drivers-header, body[data-hidden] #drivers-tower,
  body[data-hidden] #drivers-fastest, body[data-hidden] #drivers-map { display: none !important; }
  #drivers-header {
    position: absolute; left: 48px; top: 64px; width: 500px; height: 64px; box-sizing: border-box;
    padding: 8px 16px; background: var(--dd-bg); border-left: 6px solid var(--dd-accent);
    display: flex; flex-direction: column; justify-content: center; font-size: 26px; font-weight: 800;
  }
  #dd-session { font-size: 14px; font-weight: 600; color: var(--dd-dim); letter-spacing: .08em;
                text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #dd-lap { margin-right: 214px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  /* On the lap line, right-aligned over the value column; a fixed width keeps it still when the phase changes. */
  #dd-phase { position: absolute; right: 58px; top: 10px; width: 160px; box-sizing: border-box;
              padding: 3px 0; border-radius: 4px; background: var(--dd-fg); color: #0a0d12; text-align: center;
              font-size: 15px; font-weight: 800; letter-spacing: .06em; line-height: 18px; white-space: nowrap; }
  #dd-phase:empty { display: none; }
  #drivers-header.flag { border-left-color: #ff2a2a; }
  #drivers-tower {
    position: absolute; left: 48px; top: 136px; width: 500px; box-sizing: border-box;
    background: var(--dd-bg); font-size: 20px; padding: 4px 0;
  }
  .dd-row { display: grid; grid-template-columns: 30px auto 1fr 30px 42px 96px 40px; align-items: center;
            height: 40px; padding: 0 10px; gap: 8px; }
  .dd-row:nth-child(even) { background: var(--dd-row); }
  #dd-rows.grouped .dd-row:nth-child(even) { background: none; }
  #dd-rows.grouped .dd-row.alt { background: var(--dd-row); }
  .dd-pos { font-weight: 800; text-align: right; }
  /* Tyre compound: a coloured letter in a ring, as GT7 broadcasts show it. */
  .dd-tyre { width: 30px; height: 30px; box-sizing: border-box; border-radius: 50%; border: 3px solid transparent;
             display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 800;
             letter-spacing: -.02em; }
  .dd-tyre.RS { border-color: #e10600; color: #ff5a4f; }
  .dd-tyre.RM { border-color: #ffd23f; color: #ffd23f; }
  .dd-tyre.RH { border-color: #f2f4f7; color: #f2f4f7; }
  .dd-tyre.I  { border-color: #2fbf55; color: #4fdc74; }
  .dd-tyre.W  { border-color: #1e88e5; color: #4aa8ff; }
  #drivers-tower.no-fuel .dd-row { grid-template-columns: 30px auto 1fr 30px 96px 40px; }
  #drivers-tower.no-tyre .dd-row { grid-template-columns: 30px auto 1fr 42px 96px 40px; }
  #drivers-tower.no-tyre.no-fuel .dd-row { grid-template-columns: 30px auto 1fr 96px 40px; }
  #drivers-tower.no-tyre .dd-tyre, #drivers-tower.no-fuel .dd-fuel { display: none; }
  /* Qualifying: the best lap is a column of its own, beside the value column; no pit stops. */
  #drivers-tower.quali .dd-row { grid-template-columns: 30px auto 1fr 30px 96px 96px; }
  #drivers-tower.quali.no-tyre .dd-row { grid-template-columns: 30px auto 1fr 96px 96px; }
  .dd-best { text-align: right; font-size: 18px; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .dd-best.fl { color: var(--dd-purple); }
  /* Fuel in percent of the tank (GT7's fuel level is a percentage) beside a level bar. */
  .dd-fuel { display: flex; align-items: center; gap: 4px; height: 26px; color: var(--dd-fuel);
             font-size: 14px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .dd-fuel.low { color: var(--dd-fuel-low); }
  .dd-fuel-bar { position: relative; flex: none; width: 5px; height: 24px; border-radius: 2px;
                 background: rgba(255, 255, 255, 0.14); overflow: hidden; }
  .dd-fuel-bar i { position: absolute; left: 0; right: 0; bottom: 0; background: currentColor; }
  .dd-flag { justify-self: center; width: 24px; height: 18px; box-shadow: 0 0 0 1px #f2f4f7;
             background: repeating-conic-gradient(#111 0 25%, #f2f4f7 0 50%) 0 0 / 12px 12px; }
  .dd-val .dd-flag { display: inline-block; width: 16px; height: 12px; margin-right: 8px; vertical-align: 0;
                     background-size: 8px 8px; }
  /* Logo and number share one auto track: the builder's Brand logos switch (--dd-brands) folds the logo away. */
  .dd-id { display: flex; align-items: center; gap: 6px; }
  .dd-brand { display: var(--dd-brands, flex); flex: none; width: 34px; height: 28px; }
  /* A light plate keeps dark logos readable on the dark tower. */
  .dd-brand img { width: 100%; height: 100%; box-sizing: border-box; padding: 3px; border-radius: 4px;
                  background: #f2f4f7; object-fit: contain; }
  .dd-num { flex: none; width: 52px; height: 28px; line-height: 28px; text-align: center; font-weight: 800; font-size: 16px;
            border-radius: 4px; background: #39414d; color: #fff; overflow: hidden; }
  .dd-name { min-width: 0; display: flex; flex-direction: column; line-height: 1.05; }
  .dd-team { font-size: 12px; color: var(--dd-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .dd-driver { font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .dd-val { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .dd-val.fl { color: var(--dd-purple); }
  .dd-val.pb { color: var(--dd-pb); }
  .dd-pit { text-align: center; font-size: 15px; color: var(--dd-dim); font-variant-numeric: tabular-nums; }
  .dd-row.box .dd-val { color: #ffd23f; }
  .dd-row.off .dd-driver, .dd-row.off .dd-val { color: var(--dd-dim); }
  .dd-row.dnf .dd-val { color: var(--dd-accent); font-weight: 800; }
  .dd-est { display: inline-block; margin-left: 4px; padding: 0 3px; border: 1px solid #ffb454; border-radius: 3px;
            color: #ffb454; font-size: 11px; font-weight: 800; line-height: 16px; vertical-align: 3px; }
  #drivers-fastest {
    position: absolute; left: 48px; top: 760px; width: 500px; height: 44px; box-sizing: border-box;
    padding: 0 14px; background: var(--dd-bg); display: flex; align-items: center; gap: 12px; font-size: 18px;
  }
  .dd-class { display: flex; align-items: center; gap: 10px; height: 32px; box-sizing: border-box; padding: 0 10px;
              border-left: 6px solid #59626e; background: rgba(255, 255, 255, 0.08); font-size: 15px; }
  .dd-class-name { min-width: 0; font-weight: 800; letter-spacing: .06em; text-transform: uppercase;
                   white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .dd-class-lap { flex: none; margin-left: auto; font-size: 13px; font-weight: 700; color: var(--dd-dim);
                  letter-spacing: .06em; font-variant-numeric: tabular-nums; }
  #drivers-fastest b { background: var(--dd-purple); color: #fff; padding: 2px 6px; border-radius: 3px; font-size: 14px; }
  #dd-fl-class { flex: none; font-size: 14px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; }
  #dd-fl-class:empty { display: none; }
  #dd-fl-who { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #dd-fl-time { flex: none; margin-left: auto; color: var(--dd-purple); font-weight: 700; font-variant-numeric: tabular-nums; }
  #drivers-fastest.none { visibility: hidden; }
  #drivers-map { position: absolute; right: 48px; top: 64px; width: 420px; height: 420px; box-sizing: border-box;
                 background: var(--dd-bg); padding: 16px; }
  #drivers-map svg { width: 100%; height: 100%; display: block; overflow: visible; }
  #drivers-map .line { fill: none; stroke: #59626e; stroke-width: 6; stroke-linejoin: round; }
  #drivers-map .dot text { font-weight: 800; text-anchor: middle; dominant-baseline: central; }
</style>
<link rel="stylesheet" href="/drivers/override.css">
</head>
<body>
  <div id="drivers-header" data-edit="Lap and session" data-edit-kind="text">
    <span id="dd-lap">LAP 7 / 20</span><span id="dd-session">Suzuka · Stint 2</span><span id="dd-phase" data-phase="gap">GAP TO LEADER</span>
  </div>
  <div id="drivers-tower" data-edit="Timing tower" data-edit-kind="text" data-edit-props="showBrands"><div id="dd-rows">
    <div class="dd-row"><span class="dd-pos">1</span><span class="dd-id"><span class="dd-brand"><img src="/drivers/brand/bmw" alt=""></span><span class="dd-num" style="background:#c00000">7</span></span><span class="dd-name"><span class="dd-team">Team Redline</span><span class="dd-driver">BERG</span></span><span class="dd-tyre RM">RM</span><span class="dd-fuel"><span class="dd-fuel-bar"><i style="height:56%"></i></span><span>56%</span></span><span class="dd-val">Leader</span><span class="dd-pit">P1</span></div>
    <div class="dd-row"><span class="dd-pos">2</span><span class="dd-id"><span class="dd-brand"><img src="/drivers/brand/porsche" alt=""></span><span class="dd-num" style="background:#0050a0">12</span></span><span class="dd-name"><span class="dd-team">Blue Arrow</span><span class="dd-driver">LIND</span></span><span class="dd-tyre RM">RM</span><span class="dd-fuel low"><span class="dd-fuel-bar"><i style="height:7%"></i></span><span>7%</span></span><span class="dd-val">+1.4</span><span class="dd-pit">P1</span></div>
    <div class="dd-row"><span class="dd-pos">3</span><span class="dd-id"><span class="dd-brand"><img src="/drivers/brand/ferrari" alt=""></span><span class="dd-num" style="background:#2b8a3e">33</span></span><span class="dd-name"><span class="dd-team">Green Line</span><span class="dd-driver">KOVAC</span></span><span class="dd-tyre RM">RM</span><span class="dd-fuel"><span class="dd-fuel-bar"><i style="height:83%"></i></span><span>83%</span></span><span class="dd-val">+3.9</span><span class="dd-pit">P0</span></div>
  </div></div>
  <div id="drivers-fastest" data-edit="Fastest lap" data-edit-kind="text">
    <b>FL</b><span id="dd-fl-class"></span><span id="dd-fl-who">BERG · Team Redline</span><span id="dd-fl-time">1:58.412</span>
  </div>
  <div id="drivers-map" data-edit="Track map" data-edit-kind="box"><svg id="dd-svg" viewBox="0 0 100 100"></svg></div>
<script src="/overlay-fit.js" data-fit-live></script>
<script>
  "use strict";
  const SVG = "http://www.w3.org/2000/svg";
  const DEFAULT_ROWS = 15;      // while the tower cannot be measured
  const MIN_ROWS = 5;
  const LEGACY_PX = 128;        // the builder canvas height: a saved height up to it means none
  const PAGE_BOTTOM = 1016;     // the bottom margin, as the header's 64 px at the top
  const FL_GAP = 16;            // from the tower to the fastest lap box under it
  const CYCLE_MS = 15000;       // gap to the leader, then the interval
  const rows = document.getElementById("dd-rows");
  rows.textContent = "";
  document.body.setAttribute("data-hidden", "");   // off air until the relay says otherwise
  document.getElementById("drivers-fastest").classList.add("none");
  let line = null, lineTrack = null, view = null;

  function el(tag, cls, text) {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text !== undefined) n.textContent = text;
    return n;
  }
  function lapTime(ms) {
    if (typeof ms !== "number" || ms <= 0) return "";
    const m = Math.floor(ms / 60000), s = (ms % 60000) / 1000;
    return m + ":" + s.toFixed(3).padStart(6, "0");
  }
  function clock(sec) {
    const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), s = Math.floor(sec % 60);
    return (h ? h + ":" + String(m).padStart(2, "0") : m) + ":" + String(s).padStart(2, "0");
  }
  // The surname only (a one-word ID whole); the column's CSS ellipsis cuts what does not fit.
  function surname(name) {
    const parts = String(name || "").trim().split(/\s+/);
    return (parts[parts.length - 1] || "").toUpperCase();
  }
  function safeColor(c, fallback) {
    return /^(#[0-9a-fA-F]{3,8}|rgba?\([0-9., ]+\)|[a-zA-Z]+)$/.test(c || "") ? c : fallback;
  }
  let showFuel = true, showTyre = true, lastLapS = 5;
  const PHASES = ["GAP TO LEADER", "INTERVAL"];
  const QUALI_PHASES = ["GAP TO P1", "INTERVAL"];
  function phase() { return Math.floor(Date.now() / CYCLE_MS) % PHASES.length; }
  function phaseLabel() { return PHASES[phase()]; }
  function showPhase(label, key) {
    const badge = document.getElementById("dd-phase");
    badge.textContent = label;
    badge.setAttribute("data-phase", key);
  }
  const laps = {};   // entry -> {ms, until}: its last lap and when that lap stops showing
  function noteLaps(entries) {
    const now = Date.now();
    entries.forEach(function (e) {
      const ms = typeof e.last_lap_ms === "number" && e.last_lap_ms > 0 ? e.last_lap_ms : null;
      const seen = laps[e.entry];
      if (!seen) laps[e.entry] = {ms: ms, until: 0};   // a lap set before the page saw the car is old
      else if (ms !== seen.ms) laps[e.entry] = {ms: ms, until: ms ? now + lastLapS * 1000 : 0};
    });
  }
  function lapShows(e) {
    const seen = laps[e.entry];
    return !flagged(e) && ["box", "no_data", "dc", "red_flag", "est"].indexOf(e.status) < 0 &&
           !!seen && seen.ms === e.last_lap_ms && Date.now() < seen.until;
  }
  const LOGO_RETRY_MS = 60000;
  const logoFailed = {};   // brand key -> when its logo last failed to load
  function brandCell(e) {
    const cell = el("span", "dd-brand");
    const key = /^[a-z0-9-]{1,64}$/.test(e.brand || "") ? e.brand : "";
    if (!key || Date.now() - (logoFailed[key] || -Infinity) < LOGO_RETRY_MS) return cell;
    const img = el("img");
    img.alt = e.brand_name || "";
    img.onerror = function () { logoFailed[key] = Date.now(); img.remove(); };
    img.src = "/drivers/brand/" + key;
    cell.appendChild(img);
    return cell;
  }
  function gapText(e, i) {
    if (i === 0) return "Leader";
    if (e.lapped) return "+" + e.lapped + " L";
    return typeof e.gap_s === "number" ? "+" + e.gap_s.toFixed(1) : "";
  }
  function fuelPct(e) {
    return typeof e.fuel_l === "number" && isFinite(e.fuel_l)
      ? Math.round(Math.min(100, Math.max(0, e.fuel_l))) : null;
  }
  function fuelCell(e) {
    const quiet = ["est", "no_data", "dc", "no_sender", "retired"].indexOf(e.status) >= 0;
    const pct = quiet ? null : fuelPct(e);
    const cell = el("span", "dd-fuel" + (pct !== null && pct <= 10 ? " low" : ""));
    if (pct === null) return cell;   // no bar: an empty one would read as an empty tank
    const bar = el("span", "dd-fuel-bar");
    const level = el("i");
    level.style.height = pct + "%";
    bar.appendChild(level);
    cell.appendChild(bar);
    cell.appendChild(el("span", "", pct + "%"));
    return cell;
  }
  function flagged(e) { return e.finished && e.status !== "est"; }
  function column(e, i) {
    if (flagged(e)) return gapText(e, i);   // a finish is final, wherever the car is now
    if (e.status === "box") return "Box";
    if (e.status === "no_data" || e.status === "no_sender") return "No data";
    if (e.status === "retired") return "DNF";
    if (e.status === "dc") return "DC";
    if (e.status === "red_flag") return "Red flag";
    if (e.status === "est") {   // the estimated gap stays put: its last lap and fuel are stale
      if (i === 0) return "";
      if (e.lapped) return "+" + e.lapped + " L";
      return typeof e.gap_s === "number" ? "+" + e.gap_s.toFixed(e.gap_s < 100 ? 1 : 0) : "";
    }
    if (lapShows(e)) return lapTime(e.last_lap_ms);
    if (phase() === 1 && i > 0) {
      if (typeof e.interval_s === "number") return "+" + e.interval_s.toFixed(1);
      if (e.lapped) return "+" + e.lapped + " L";
    }
    return gapText(e, i);
  }
  // `best` (qualifying) adds the best lap cell before the value and leaves out the pit stops.
  function row(e, i, value, pits, fl, best) {
    const done = flagged(e);
    const r = el("div", "dd-row" + (done ? "" : e.status === "box" ? " box" :
                                    e.status === "retired" ? " off dnf" :
                                    ["no_data", "dc", "no_sender"].indexOf(e.status) >= 0 ? " off" : ""));
    r.appendChild(el("span", "dd-pos", String(e.pos)));
    const num = el("span", "dd-num", e.number || String(e.entry || "").slice(0, 3));
    num.style.background = safeColor(e.color, "#39414d");
    num.style.color = safeColor(e.text_color, "#fff");
    const id = el("span", "dd-id");
    id.appendChild(brandCell(e));
    id.appendChild(num);
    r.appendChild(id);
    const name = el("span", "dd-name");
    name.appendChild(el("span", "dd-team", e.team || String(e.entry || "").replace(/\s*#\d+$/, "")));
    name.appendChild(el("span", "dd-driver", surname(e.driver)));
    r.appendChild(name);
    const slots = (showTyre ? 1 : 0) + (showFuel ? 1 : 0);
    if (done && slots) {   // the chequered flag takes the tyre and fuel columns
      const flag = el("span", "dd-flag");
      flag.style.gridColumn = "span " + slots;
      r.appendChild(flag);
    } else if (!done) {
      const code = e.status !== "retired" && ["RS", "RM", "RH", "I", "W"].indexOf(e.compound) >= 0 ? e.compound : "";
      r.appendChild(el("span", "dd-tyre" + (code ? " " + code : ""), code));
      r.appendChild(fuelCell(e));
    }
    if (best) r.appendChild(el("span", "dd-best" + (best.fl ? " fl" : ""), best.text));
    const val = el("span", "dd-val" + (fl ? " " + (fl === true ? "fl" : fl) : ""));
    if (done && !slots) val.appendChild(el("span", "dd-flag"));
    val.appendChild(document.createTextNode(value));
    if (e.status === "est") val.appendChild(el("span", "dd-est", "EST"));
    r.appendChild(val);
    if (!best) r.appendChild(el("span", "dd-pit", pits));
    return r;
  }
  // The rows for a tower measured empty as m = {box: its height, inner: that without padding and
  // border, top, rowH, below: what the fastest lap box under it needs}. A set height holds the rows
  // it fits; without one the tower grows down the page.
  function capacity(m) {
    if (!(m.rowH > 0)) return DEFAULT_ROWS;
    const room = m.box > LEGACY_PX ? m.inner : PAGE_BOTTOM - m.below - m.top - (m.box - m.inner);
    return Math.max(MIN_ROWS, Math.floor(room / m.rowH));
  }
  // Whether the fastest lap box sits under the tower, in its column, and so moves with it.
  function follows(t, f) {
    return f.top >= t.top && f.left < t.left + t.width && f.left + f.width > t.left;
  }
  function rect(n) { return {left: n.offsetLeft, top: n.offsetTop, width: n.offsetWidth}; }
  let flFollows = false;
  // Clears the rows and measures the tower and the fastest lap box at their layout positions,
  // so a resize or a new layout applies on the next render.
  function towerRows() {
    rows.replaceChildren();
    const tower = document.getElementById("drivers-tower"), fl = document.getElementById("drivers-fastest");
    tower.style.height = "";
    fl.style.top = "";
    flFollows = false;
    if (typeof getComputedStyle !== "function" || !tower.getClientRects().length) return DEFAULT_ROWS;
    if (tower.offsetHeight <= LEGACY_PX) {
      tower.style.height = "auto";
      flFollows = follows(rect(tower), rect(fl));
    }
    const cs = getComputedStyle(tower);
    const inner = tower.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
    const probe = rows.appendChild(el("div", "dd-row"));
    const rowH = parseFloat(getComputedStyle(probe).height);
    rows.replaceChildren();
    return capacity({box: tower.offsetHeight, inner: inner, top: tower.offsetTop, rowH: rowH,
                     below: flFollows ? fl.offsetHeight + FL_GAP : 0});
  }
  // Puts a following fastest lap box under the tower's last row.
  function placeFastest() {
    if (!flFollows) return;
    const tower = document.getElementById("drivers-tower");
    document.getElementById("drivers-fastest").style.top = tower.offsetTop + tower.offsetHeight + FL_GAP + "px";
  }
  // The tower's pages: without classes one page of the first rows; with classes each class under
  // its header, all on one page when they fit, else one class per page cut at the page.
  function pages(entries, list, max) {
    if (!list || !list.length) return [entries.slice(0, max)];
    const groups = list.map(function (cls) {
      return [{header: cls}].concat(entries.filter(function (e) { return (e.class || "") === cls.name; }));
    }).filter(function (g) { return g.length > 1; });
    const all = [].concat(...groups);
    if (all.length <= max) return [all];
    return groups.map(function (g) { return g.slice(0, max); });
  }
  function classHeader(cls) {
    const color = safeColor(cls.color, "#59626e");
    const h = el("div", "dd-class");
    h.style.borderLeftColor = color;
    const name = el("span", "dd-class-name", cls.name || "");
    name.style.color = safeColor(cls.color, "var(--dd-fg)");
    h.appendChild(name);
    h.appendChild(el("span", "dd-class-lap",
                     cls.lap ? "LAP " + cls.lap + (cls.laps ? " / " + cls.laps : "") : ""));
    return h;
  }
  // A row as its class sees it: class position, gap, interval and laps down.
  function inClass(e) {
    return Object.assign({}, e, {pos: e.class_pos, gap_s: e.class_gap_s, interval_s: e.class_interval_s,
                                 lapped: e.class_lapped || 0});
  }
  function renderRace(d) {
    const lap = d.lap || {};
    document.getElementById("dd-lap").textContent =
      typeof d.remaining === "number" ? clock(d.remaining)
      : lap.leader ? "LAP " + lap.leader + (lap.count ? " / " + lap.count : "") : "";
    const fl = d.fastest;
    const list = d.classes || [];
    noteLaps(d.entries || []);
    const book = pages(d.entries || [], list, towerRows());
    const page = book[book.length > 1 ? Math.floor(Date.now() / (CYCLE_MS * PHASES.length)) % book.length : 0];
    let inGroup = 0;
    let group = null;
    rows.classList.toggle("grouped", list.length > 0);
    rows.replaceChildren(...page.map(function (item, i) {
      if (item.header) { inGroup = 0; group = item.header; return classHeader(item.header); }
      const e = list.length ? inClass(item) : item;
      const at = list.length ? e.pos - 1 : i;
      const best = list.length ? group && group.fastest : fl;
      const r = row(e, at, column(e, at), "P" + (e.pit_stops || 0),
                    best && best.entry === e.entry && e.last_lap_ms === best.ms && lapShows(e));
      if (list.length && inGroup++ % 2) r.className += " alt";
      return r;
    }));
    placeFastest();
    showPhase(phaseLabel(), ["gap", "interval"][phase()]);
    fastestBox(book, page, list, fl);
    drawCars(d.entries || []);
  }
  // A paged tower shows its page's class; one page cycles the classes that have a lap.
  function fastestBox(book, page, list, fl) {
    const timed = list.filter(function (c) { return c.fastest; });
    const cls = book.length > 1 ? page[0].header
      : timed.length ? timed[Math.floor(Date.now() / CYCLE_MS) % timed.length] : null;
    const shown = list.length ? cls && cls.fastest : fl;
    const label = document.getElementById("dd-fl-class");
    label.textContent = cls ? cls.name || "" : "";
    label.style.color = cls ? safeColor(cls.color, "") : "";
    const box = document.getElementById("drivers-fastest");
    box.classList.toggle("none", !shown);
    if (shown) {
      document.getElementById("dd-fl-who").textContent =
        surname(shown.driver) + " · " + (shown.team || String(shown.entry).replace(/\s*#\d+$/, ""));
      document.getElementById("dd-fl-time").textContent = lapTime(shown.ms);
    }
  }
  function plusMs(ms) { return typeof ms === "number" ? "+" + (ms / 1000).toFixed(3) : ""; }
  // A qualifying row's value: a fresh lap, else the gap to P1 or the interval by best lap.
  function qualiColumn(e, i) {
    if (lapShows(e)) return lapTime(e.last_lap_ms);
    if (typeof e.best_ms !== "number") return "";
    if (i === 0) return "Pole";
    return plusMs(phase() === 1 ? e.interval_ms : e.gap_ms);
  }
  // A fresh lap's colour: purple for P1's (its class's) best, green for a personal best.
  function lapMark(e, i) {
    if (!lapShows(e) || e.last_lap_ms !== e.best_ms) return false;
    return i === 0 ? "fl" : "pb";
  }
  function renderQualifying(d) {
    // The session line names the segment; a running timer takes the lap line, as in the race.
    document.getElementById("dd-lap").textContent = typeof d.remaining === "number" ? clock(d.remaining) : "QUALIFYING";
    const list = d.classes || [];
    const entries = d.qualifying || [];
    noteLaps(entries);
    const book = pages(entries, list, towerRows());
    const page = book[book.length > 1 ? Math.floor(Date.now() / (CYCLE_MS * QUALI_PHASES.length)) % book.length : 0];
    let inGroup = 0;
    rows.classList.toggle("grouped", list.length > 0);
    rows.replaceChildren(...page.map(function (item, i) {
      if (item.header) { inGroup = 0; return classHeader(item.header); }
      const e = list.length ? Object.assign({}, item, {pos: item.class_pos, gap_ms: item.class_gap_ms,
                                                       interval_ms: item.class_interval_ms}) : item;
      const at = list.length ? e.pos - 1 : i;
      const r = row(e, at, qualiColumn(e, at), "", lapMark(e, at),
                    {text: lapTime(e.best_ms), fl: at === 0 && typeof e.best_ms === "number"});
      if (list.length && inGroup++ % 2) r.className += " alt";
      return r;
    }));
    placeFastest();
    showPhase(QUALI_PHASES[phase()], ["gap", "interval"][phase()]);
    // No fastest lap box: the best lap column holds each driver's best.
    const label = document.getElementById("dd-fl-class");
    label.textContent = "";
    label.style.color = "";
    document.getElementById("drivers-fastest").classList.add("none");
    drawCars([]);
  }
  function project(x, z) {
    return [(x - view.x0) * view.k + view.dx, (z - view.z0) * view.k + view.dz];
  }
  function drawLine() {
    const svg = document.getElementById("dd-svg");
    svg.replaceChildren();
    if (!line || !line.points || line.points.length < 2) { view = null; return; }
    const xs = line.points.map(function (p) { return p[0]; }), zs = line.points.map(function (p) { return p[1]; });
    const x0 = Math.min(...xs), z0 = Math.min(...zs), w = Math.max(...xs) - x0 || 1, h = Math.max(...zs) - z0 || 1;
    const k = 92 / Math.max(w, h);
    view = {x0: x0, z0: z0, k: k, dx: 4 + (92 - w * k) / 2, dz: 4 + (92 - h * k) / 2};
    const path = document.createElementNS(SVG, "polyline");
    path.setAttribute("class", "line");
    path.setAttribute("vector-effect", "non-scaling-stroke");
    path.setAttribute("points", line.points.map(function (p) { return project(p[0], p[1]).join(","); }).join(" ") +
                      " " + project(line.points[0][0], line.points[0][1]).join(","));
    svg.appendChild(path);
    const cars = document.createElementNS(SVG, "g");
    cars.id = "dd-cars";
    svg.appendChild(cars);
  }
  const DOT_R = 2.8, CLEAR = 2 * DOT_R + 0.4;
  // Each dot sits on the line at its car's spot (spots in running order). One that would cover a
  // dot ahead slides back by up to one and a half dot widths, never past the next car's spot, else it overlaps.
  function placeDots(line, spots) {
    const n = line.length, cum = [0];
    for (let i = 1; i <= n; i++) {
      const a = line[i - 1], b = line[i % n];
      cum.push(cum[i - 1] + Math.hypot(b[0] - a[0], b[1] - a[1]));
    }
    const total = cum[n] || 1;
    function at(s) {
      s = ((s % total) + total) % total;
      let i = 1;
      while (i < n && cum[i] < s) i++;
      const a = line[i - 1], b = line[i % n], len = cum[i] - cum[i - 1];
      const f = len > 0 ? (s - cum[i - 1]) / len : 0;
      return [a[0] + (b[0] - a[0]) * f, a[1] + (b[1] - a[1]) * f];
    }
    function station(p) {
      let best = 0, bestD = Infinity;
      for (let i = 0; i < n; i++) {
        const a = line[i], b = line[(i + 1) % n], dx = b[0] - a[0], dy = b[1] - a[1];
        const len2 = dx * dx + dy * dy;
        const f = len2 > 0 ? Math.max(0, Math.min(1, ((p[0] - a[0]) * dx + (p[1] - a[1]) * dy) / len2)) : 0;
        const d = Math.hypot(a[0] + dx * f - p[0], a[1] + dy * f - p[1]);
        if (d < bestD) { bestD = d; best = cum[i] + f * Math.sqrt(len2); }
      }
      return best;
    }
    const st = spots.map(station), placed = [];
    function free(q) { return placed.every(function (o) { return Math.hypot(o[0] - q[0], o[1] - q[1]) >= CLEAR; }); }
    return st.map(function (s, i) {
      const gap = i + 1 < st.length ? ((s - st[i + 1]) % total + total) % total : Infinity;
      const room = Math.min(1.5 * CLEAR, gap), own = at(s);
      let spot = own;
      for (let k = 1; k <= 4 && !free(spot); k++) spot = at(s - room * k / 4);
      if (!free(spot)) spot = own;
      placed.push(spot);
      return spot;
    });
  }
  function drawCars(entries) {
    const g = document.getElementById("dd-cars");
    if (!g || !view) return;
    const cars = entries.filter(function (e) { return typeof e.x === "number" && typeof e.z === "number"; });
    const spots = placeDots(line.points.map(function (q) { return project(q[0], q[1]); }),
                            cars.map(function (e) { return project(e.x, e.z); }));
    const dots = cars.map(function (e, i) { return [e, spots[i]]; });
    g.replaceChildren(...dots.reverse().map(function (item) {   // the car ahead is drawn last, on top
      const e = item[0], p = item[1];
      const dot = document.createElementNS(SVG, "g");
      dot.setAttribute("class", "dot");
      const c = document.createElementNS(SVG, "circle");
      c.setAttribute("cx", p[0]); c.setAttribute("cy", p[1]); c.setAttribute("r", DOT_R);
      c.setAttribute("fill", safeColor(e.color, "#39414d"));
      c.setAttribute("stroke", "#fff"); c.setAttribute("stroke-width", 0.4);
      if (e.class_color) {
        c.setAttribute("stroke", safeColor(e.class_color, "#fff")); c.setAttribute("stroke-width", 0.8);
      }
      if (e.status === "est") {   // an estimated position: amber dashed ring, as the tower's EST tag
        c.setAttribute("stroke", "#ffb454"); c.setAttribute("stroke-width", 0.8);
        c.setAttribute("stroke-dasharray", "1 0.7");
      }
      const t = document.createElementNS(SVG, "text");
      t.setAttribute("x", p[0]); t.setAttribute("y", p[1]);
      t.setAttribute("fill", safeColor(e.text_color, "#fff"));
      t.textContent = e.number || String(e.pos);
      t.setAttribute("font-size", t.textContent.length > 2 ? 2.0 : 2.6);
      dot.appendChild(c); dot.appendChild(t);
      return dot;
    }));
  }
  async function loadLine(track) {
    lineTrack = track;
    line = null;
    try {
      const res = await fetch("/drivers/line", {cache: "no-store"});
      if (res.ok) line = await res.json();
    } catch (e) { /* the map stays empty until the next track change */ }
    drawLine();
  }
  async function poll() {
    try {
      const res = await fetch("/drivers/dashboard", {cache: "no-store"});
      if (res.ok) {
        const d = await res.json();
        document.body.toggleAttribute("data-hidden", d.visible !== true);
        document.getElementById("drivers-header").classList.toggle("flag", !!d.red_flag);
        document.getElementById("dd-session").textContent =
          [d.track_name, d.stint, d.red_flag ? "Red flag" : ""].filter(Boolean).join(" · ");
        if ((d.track || null) !== lineTrack) await loadLine(d.track || null);
        const show = d.show || {};
        showFuel = show.fuel !== false && d.mode !== "qualifying";
        showTyre = show.compound !== false;
        lastLapS = typeof show.last_lap_s === "number" ? show.last_lap_s : 5;
        const tower = document.getElementById("drivers-tower");
        tower.classList.toggle("no-tyre", !showTyre);
        tower.classList.toggle("no-fuel", !showFuel);
        tower.classList.toggle("quali", d.mode === "qualifying");
        if (d.mode === "qualifying") renderQualifying(d); else renderRace(d);
      }
    } catch (e) { /* transient; keep the last render */ }
    setTimeout(poll, 1000);
  }
  poll();
</script>
</body>
</html>
