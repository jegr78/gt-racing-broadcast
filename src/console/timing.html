<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Live timing</title>
<style>
  :root { color-scheme: dark; --bg: #0b0d10; --panel: #14171c; --edge: #232830; --ink: #e8eaed;
          --muted: #9aa0a6; --accent: #e10600; --purple: #c49bff; --pb: #4fdc74; --warn: #ffd361; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.4 system-ui, sans-serif; }
  header { padding: 14px 16px 10px; background: var(--panel); border-bottom: 3px solid var(--accent); }
  header > div { max-width: 1100px; margin: 0 auto; }
  header h1 { margin: 0; font-size: 20px; font-weight: 800; letter-spacing: .02em; }
  #session { margin-top: 4px; color: var(--muted); font-size: 13px; display: flex; flex-wrap: wrap; gap: 4px 14px; }
  #session .flag { color: #ff6b6b; font-weight: 800; }
  #session .stale { color: var(--warn); }
  main { padding: 12px 16px 24px; max-width: 1100px; margin: 0 auto; }
  .tools { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-bottom: 10px; }
  .cols { display: flex; flex-wrap: wrap; gap: 6px; }
  #classpick { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); }
  #classpick[hidden] { display: none; }
  #classpick select { background: var(--panel); color: var(--ink); border: 1px solid var(--edge); border-radius: 999px;
                      padding: 3px 8px; font: inherit; font-size: 13px; }
  .cols label { display: inline-flex; align-items: center; gap: 5px; font-size: 13px; color: var(--muted);
                border: 1px solid var(--edge); border-radius: 999px; padding: 3px 10px; cursor: pointer; }
  .cols input { margin: 0; }
  .wrap { overflow-x: auto; border: 1px solid var(--edge); border-radius: 10px; background: var(--panel); }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  th { text-align: left; font-size: 12px; font-weight: 600; color: var(--muted); padding: 8px 8px; white-space: nowrap; }
  td { padding: 7px 8px; border-top: 1px solid var(--edge); white-space: nowrap; }
  td.pos { font-weight: 800; text-align: right; width: 2.5em; }
  td.num span { display: inline-block; min-width: 30px; text-align: center; border-radius: 4px; padding: 1px 5px;
                font-weight: 800; background: #39414d; color: #fff; }
  td.drv { white-space: normal; min-width: 120px; }
  td.brand { width: 40px; padding-left: 2px; padding-right: 2px; }
  td.brand img { display: block; width: 36px; height: 24px; box-sizing: border-box; padding: 2px; margin: 0 auto;
                 object-fit: contain; border-radius: 4px; background: #f2f4f7; }
  td.drv small { display: block; color: var(--muted); font-size: 12px; }
  tr.cls td { background: #1b1f25; font-weight: 800; white-space: normal; }
  tr.cls .lap { margin-left: 10px; color: var(--muted); font-weight: 600; font-size: 13px; }
  .flcls { font-weight: 800; margin-right: 8px; }
  tr.box td { color: var(--warn); }
  tr.off td { color: var(--muted); }
  tr.dnf td[data-col="gap"] { color: var(--accent); font-weight: 700; }
  .est { display: inline-block; margin-left: 5px; padding: 0 5px; border: 1px solid var(--warn); border-radius: 4px;
         color: var(--warn); font-size: 11px; font-weight: 700; line-height: 1.45; vertical-align: 1px; }
  .fl { color: var(--purple); font-weight: 700; }
  .pb { color: var(--pb); font-weight: 700; }
  .chequer { display: inline-block; width: 16px; height: 12px; margin-right: 6px; vertical-align: -1px;
             box-shadow: 0 0 0 1px #f2f4f7;
             background: repeating-conic-gradient(#111 0 25%, #f2f4f7 0 50%) 0 0 / 8px 8px; }
  .tyre { font-weight: 800; }
  .tyre.RS { color: #ff5a4f; } .tyre.RM { color: #ffd23f; } .tyre.RH { color: #f2f4f7; }
  .tyre.I { color: #4fdc74; } .tyre.W { color: #4aa8ff; }
  [data-col][hidden] { display: none; }
  #fastest { margin: 12px 0 0; font-size: 14px; }
  #feed { margin-top: 18px; }
  #feed h2 { font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0 0 6px; }
  #feed div { font-size: 13px; padding: 3px 0; border-bottom: 1px solid var(--edge); }
  #feed time { color: var(--muted); margin-right: 8px; font-variant-numeric: tabular-nums; }
  #state { color: var(--muted); font-size: 13px; padding: 14px; text-align: center; }
  @media (max-width: 600px) { main { padding: 10px 8px 20px; } td, th { padding: 6px 5px; } body { font-size: 14px; }
                              td.drv { min-width: 88px; } td.brand { width: 28px; padding: 0 1px; }
                              td.brand img { width: 26px; height: 18px; padding: 1px; }
                              /* Qualifying has two lap time columns: they and the names give way. */
                              #timing.quali td.drv { min-width: 64px; }
                              #timing.quali td[data-col="best"], #timing.quali td[data-col="gap"],
                              #timing.quali td[data-col="int"], #timing.quali td[data-col="last"] {
                                font-size: 12px; padding-left: 3px; padding-right: 3px; } }
</style>
</head>
<body>
<header><div>
  <h1>Live timing</h1>
  <div id="session"></div>
</div></header>
<main>
  <div class="tools">
    <label id="classpick" hidden><span>Class</span><select id="class-filter"></select></label>
    <div class="cols" id="cols"></div>
  </div>
  <div class="wrap"><table id="timing"><thead></thead><tbody></tbody></table>
    <div id="state">Waiting for timing data…</div></div>
  <div id="fastest"></div>
  <section id="feed" hidden><h2>Activity</h2><div id="events"></div></section>
</main>
<script id="timing-logic">
  "use strict";
  // Transport decisions for the hosted page and the Funnel page (#1161); pure, tested by deno.
  window.TimingLogic = {
    hostedLink: function (pathname) {
      const m = /^\/t\/([A-Za-z0-9_-]{16,64})\/?$/.exec(pathname);
      return m ? m[1] : null;
    },
    FALLBACK_AFTER: 3,          // failed reconnects (the drop itself is not one)
    FALLBACK_MIN_S: 12,         // since the drop
    UNAVAILABLE_AFTER: 6,
    UNAVAILABLE_RETRY_MS: 120000,
    GIVE_UP_S: 1800,
    RETURN_AFTER_S: 60,         // on the Funnel page after an automatic fallback
    MOVED_RETURN_AFTER_S: 10,   // after a deliberate move; outlasts a room's stale redirect
    // Leave the hosted page only when the host itself is unreachable. Silence on an open
    // socket means the relay went quiet, and Funnel runs on that same relay.
    // s: {failedReconnects, sinceDropS, publisherUp, fallback}
    fallbackDecision: function (s) {
      if (!s.fallback || s.publisherUp === false) return "stay";
      return s.failedReconnects >= this.FALLBACK_AFTER && s.sinceDropS >= this.FALLBACK_MIN_S
        ? "redirect" : "stay";
    },
    // Milliseconds until the next socket attempt, or null to stop retrying.
    reconnectDelayMs: function (s) {
      if (s.sinceDropS >= this.GIVE_UP_S) return null;
      if (this.unavailable(s)) return this.UNAVAILABLE_RETRY_MS;
      return Math.max(1000, Math.min(8000, 1000 * Math.pow(2, s.failedReconnects - 1)));
    },
    unavailable: function (s) {
      return s.failedReconnects >= this.UNAVAILABLE_AFTER || s.sinceDropS >= this.GIVE_UP_S;
    },
    fallbackUrl: function (url) {
      return typeof url === "string" && /^https:\/\//.test(url) ? url : null;
    },
    // reason: "host" (the host failed) or "moved" (the producer switched to Funnel).
    fallbackTarget: function (url, reason) {
      return url + (url.indexOf("?") >= 0 ? "&" : "?") + "from=" + (reason === "moved" ? "moved" : "host");
    },
    // The Funnel data names the hosted link only while the host is served and its publisher
    // is connected; a viewer who fell back waits a while so a flaky host cannot ping-pong it.
    LOGO_RETRY_MS: 60000,
    LOGO_MAX_B64: 349528,       // base64 of the relay's 256 KiB cap
    LOGO_RETRY_MAX_MS: 1800000,
    // A brand logo beside the page: /t/<id>/brand/<key> on the host, ?l=<id> on Funnel.
    brandUrl: function (pathname, search, key) {
      if (typeof key !== "string" || !/^[a-z0-9-]{1,64}$/.test(key)) return null;
      const url = pathname.replace(/\/?$/, "/brand/") + key;
      const id = /(?:^\?|&)l=([A-Za-z0-9_-]+)/.exec(search || "");
      return id ? url + "?l=" + id[1] : url;
    },
    // A logo from the host's socket: {key, bytes} for a PNG, else null.
    brandMessage: function (m) {
      if (!m || typeof m.key !== "string" || !/^[a-z0-9-]{1,64}$/.test(m.key)) return null;
      if (typeof m.png !== "string" || m.png.length > this.LOGO_MAX_B64) return null;
      let raw;
      try { raw = atob(m.png); } catch (e) { return null; }
      const bytes = new Uint8Array(raw.length);
      for (let i = 0; i < raw.length; i++) bytes[i] = raw.charCodeAt(i);
      const magic = [0x89, 0x50, 0x4e, 0x47, 0x0d, 0x0a, 0x1a, 0x0a];
      return bytes.length > magic.length && magic.every(function (b, i) { return bytes[i] === b; })
        ? {key: m.key, bytes: bytes} : null;
    },
    // A logo that failed loads again after a while (the host may receive it later),
    // each failure doubling the wait. fail: {at, n} or undefined.
    logoWanted: function (fail, now) {
      if (!fail) return true;
      return now - fail.at >= Math.min(this.LOGO_RETRY_MAX_MS, this.LOGO_RETRY_MS * Math.pow(2, fail.n - 1));
    },
    funnelMove: function (data, search, sinceLoadS) {
      const to = data && data.moved_to;
      if (typeof to !== "string" || !/^https:\/\//.test(to)) return null;
      const from = /(?:^|[?&])from=(host|moved)(?:&|$)/.exec(search || "");
      if (!from) return to;
      const dwell = from[1] === "host" ? this.RETURN_AFTER_S : this.MOVED_RETURN_AFTER_S;
      return sinceLoadS >= dwell ? to : null;
    }
  };
</script>
<script>
  "use strict";
  const LOGIC = window.TimingLogic;
  const HOSTED = LOGIC.hostedLink(location.pathname);
  // Race columns the reader can switch.
  const RACE = [["pos", "Pos"], ["brand", ""], ["num", "#"], ["drv", "Driver"], ["tyre", "Tyre"], ["laps", "Laps"],
                ["gap", "Gap"], ["int", "Int."], ["last", "Last"], ["fuel", "Fuel"], ["pits", "Pits"]];
  const QUALI = [["pos", "Pos"], ["brand", ""], ["num", "#"], ["drv", "Driver"], ["tyre", "Tyre"], ["best", "Best"],
                 ["gap", "Gap"], ["int", "Int."], ["last", "Last"]];
  const OPTIONAL = [["brand", "Brand"], ["tyre", "Tyre"], ["laps", "Laps"], ["gap", "Gap"], ["int", "Int."], ["last", "Last"],
                    ["fuel", "Fuel"], ["pits", "Pits"]];
  const STATUS = {box: "Box", no_data: "No data", dc: "DC", red_flag: "Red flag", no_sender: "No data", retired: "DNF"};
  const DATA = location.pathname.replace(/\/?$/, "/data") + location.search;
  // Hosted page state: the WebSocket to the host and what it last said.
  let sock = null, failed = 0, live = false, droppedAt = Date.now(), publisherUp = true, fallback = null, ended = false;
  const loadedAt = Date.now();
  // A phone starts without laps, interval and fuel; the switches bring them back.
  let hidden = new Set(window.matchMedia("(max-width: 600px)").matches ? ["laps", "int", "fuel"] : []);
  try {
    const saved = localStorage.getItem("timing-hidden");
    if (saved !== null) hidden = new Set(JSON.parse(saved));
  } catch (e) { /* defaults */ }
  let classPick = null;   // the class the reader filters to; null shows them all
  try {
    const saved = JSON.parse(localStorage.getItem("timing-class"));
    if (typeof saved === "string") classPick = saved;
  } catch (e) { /* all classes */ }
  let last = null;
  // Poll pacing comes from the server (X-Poll-After); between polls the clock runs locally.
  let etag = null, interval = 2, got = 0, dataAge = 0;
  const $ = (id) => document.getElementById(id);

  function el(tag, cls, text) {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text !== undefined && text !== null) n.textContent = String(text);
    return n;
  }
  function lapTime(ms) {
    if (typeof ms !== "number" || ms <= 0) return "";
    const m = Math.floor(ms / 60000), s = (ms % 60000) / 1000;
    return m + ":" + s.toFixed(3).padStart(6, "0");
  }
  function clock(sec) {
    const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), s = Math.floor(sec % 60);
    return (h ? h + ":" + String(m).padStart(2, "0") : m) + ":" + String(s).padStart(2, "0");
  }
  function hex(c) { return /^#[0-9a-fA-F]{3,8}$/.test(c || "") ? c : ""; }
  function shade(c) {
    return typeof c === "string" && /^(#[0-9a-fA-F]{3,8}|(rgb|hsl)a?\([0-9a-zA-Z.,%\s\/]+\)|[a-zA-Z]{3,20})$/.test(c) ? c : "";
  }

  function switches() {
    const box = $("cols");
    box.replaceChildren(...OPTIONAL.map(function (c) {
      const input = el("input");
      input.type = "checkbox";
      input.checked = !hidden.has(c[0]);
      input.addEventListener("change", function () {
        if (input.checked) hidden.delete(c[0]); else hidden.add(c[0]);
        try { localStorage.setItem("timing-hidden", JSON.stringify(Array.from(hidden))); } catch (e) { /* session only */ }
        if (last) render(last);
      });
      const label = el("label");
      label.append(input, el("span", "", c[1]));
      return label;
    }));
  }

  // The class filter: All plus each named class, rebuilt only when the classes change.
  let pickNames = [];
  function picker(classes) {
    const names = classes.map(function (c) { return c.name; }).filter(Boolean);
    const sel = $("class-filter");
    $("classpick").hidden = !names.length;
    if (JSON.stringify(names) !== JSON.stringify(pickNames)) {
      pickNames = names;
      const all = el("option", "", "All classes");
      all.value = "all";
      sel.replaceChildren(all, ...names.map(function (n, i) {
        const o = el("option", "", n);
        o.value = "c" + i;
        return o;
      }));
    }
    const shown = names.indexOf(classPick) >= 0 ? classPick : null;
    sel.value = shown === null ? "all" : "c" + names.indexOf(shown);
    return shown;
  }
  $("class-filter").addEventListener("change", function () {
    const v = $("class-filter").value;
    classPick = v === "all" ? null : pickNames[parseInt(v.slice(1), 10)] || null;
    try { localStorage.setItem("timing-class", JSON.stringify(classPick)); } catch (e) { /* session only */ }
    if (last) render(last);
  });
  function classHead(c, span) {
    const name = el("span", "", c.name || "Unclassed");
    if (shade(c.color)) name.style.color = shade(c.color);
    const td = el("td");
    td.colSpan = span;
    td.append(name);
    if (typeof c.lap === "number") {
      td.append(el("span", "lap", "Lap " + c.lap + (typeof c.laps === "number" ? " / " + c.laps : "")));
    }
    const tr = el("tr", "cls");
    tr.append(td);
    return tr;
  }
  function fastestText(fl) {
    return [el("span", "fl", "Fastest lap " + lapTime(fl.ms)),
            document.createTextNode(" · " + fitName(fl.driver, NAME_MAX) + " (" + (fl.team || fl.entry) + ")")];
  }

  function plusMs(ms) { return typeof ms === "number" ? "+" + (ms / 1000).toFixed(3) : ""; }
  // A qualifying last lap that set a best: purple for P1 (of its class), green for a personal best.
  function qualiMark(e, i) {
    if (typeof e.last_lap_ms !== "number" || e.last_lap_ms !== e.best_ms) return "";
    return i === 0 ? "fl" : "pb";
  }
  function cell(key, value, cls) {
    const td = el("td", cls);
    td.dataset.col = key;
    if (value instanceof Node) td.appendChild(value); else td.textContent = value === undefined || value === null ? "" : String(value);
    return td;
  }
  // An estimated position: the gap Race Control set, marked EST.
  function estGap(e, i) {
    const s = el("span", "", i === 0 ? "" : e.lapped ? "+" + e.lapped + " L"
                 : typeof e.gap_s === "number" ? "+" + e.gap_s.toFixed(1) : "");
    s.appendChild(el("span", "est", "EST"));
    return s;
  }
  // A finished car: the chequered flag and its final gap.
  function finishedGap(e, i) {
    const s = el("span", "", null);
    const flag = el("span", "chequer");
    flag.title = "Finished";
    s.append(flag, i === 0 ? "" : e.lapped ? "+" + e.lapped + " L"
             : typeof e.gap_s === "number" ? "+" + e.gap_s.toFixed(1) : "");
    return s;
  }
  function numCell(e) {
    const s = el("span", "", e.number || String(e.entry || "").slice(0, 3));
    if (hex(e.color)) s.style.background = hex(e.color);
    if (hex(e.text_color)) s.style.color = hex(e.text_color);
    return cell("num", s, "num");
  }
  const logoFailed = {};   // brand key -> {at, n}: its last failed load and how many
  const hostedLogos = {};  // brand key -> blob URL of the logo the host's socket sent
  function brandCell(e) {
    const td = cell("brand", "", "brand");
    // The hosted page gets its logos over the socket: a request per logo would cost quota.
    const url = HOSTED ? hostedLogos[e.brand] : LOGIC.brandUrl(location.pathname, location.search, e.brand);
    if (!url || !LOGIC.logoWanted(logoFailed[e.brand], Date.now())) return td;
    const img = el("img");
    img.alt = e.brand_name || "";
    img.title = e.brand_name || "";
    img.onerror = function () {
      logoFailed[e.brand] = {at: Date.now(), n: (logoFailed[e.brand] ? logoFailed[e.brand].n : 0) + 1};
      img.remove();
    };
    img.src = url;
    td.appendChild(img);
    return td;
  }
  // The whole name if it fits; else the first name as an initial; else cut with an ellipsis.
  function fitName(name, max) {
    var s = String(name || "").trim();
    if (s.length <= max) return s;
    var parts = s.split(/\s+/);
    if (parts.length > 1) {
      s = parts[0].charAt(0) + ". " + parts.slice(1).join(" ");
      if (s.length <= max) return s;
    }
    return s.slice(0, max - 1) + "\u2026";
  }
  const NAME_MAX = 16;
  function driverCell(e) {
    const d = el("div", "", fitName(e.driver, NAME_MAX));
    d.appendChild(el("small", "", e.team || e.entry || ""));
    return cell("drv", d, "drv");
  }
  function tyreCell(e) {
    const code = ["RS", "RM", "RH", "I", "W"].indexOf(e.compound) >= 0 ? e.compound : "";
    return cell("tyre", el("span", "tyre" + (code ? " " + code : ""), code));
  }

  function render(d) {
    last = d;
    const quali = d.mode === "qualifying";
    const allowed = function (key) { return !hidden.has(key); };
    const cols = (quali ? QUALI : RACE).filter(function (c) { return allowed(c[0]); });
    const parts = [];
    if (quali) parts.push("Qualifying");
    else if (d.lap && d.lap.leader) parts.push("Lap " + d.lap.leader + (d.lap.count ? " / " + d.lap.count : ""));
    if (typeof d.remaining === "number") parts.push(null);
    if (d.track_name) parts.push(d.track_name);
    if (d.stint) parts.push(d.stint);
    $("session").replaceChildren(...parts.map(function (p) {
      const span = el("span", "", p);
      if (p === null) span.id = "left";
      return span;
    }));
    if (d.red_flag) $("session").appendChild(el("span", "flag", "RED FLAG"));
    $("session").appendChild(el("span", "", "")).id = "age";
    tick();
    $("timing").className = quali ? "quali" : "";
    $("timing").tHead.replaceChildren(el("tr"));
    cols.forEach(function (c) { $("timing").tHead.rows[0].appendChild(el("th", "", c[1])); });
    const rows = quali ? (d.qualifying || []) : (d.entries || []);
    const fl = d.fastest;
    // Class mode: each class under its header with positions and gaps within the class.
    const classes = Array.isArray(d.classes)
      ? d.classes.filter(function (c) { return c && typeof c.name === "string"; }) : [];
    const shown = picker(classes);
    const groups = classes.length ? classes.filter(function (c) { return shown === null || c.name === shown; })
      .map(function (c) {
        return {cls: c, rows: rows.filter(function (e) { return (e.class == null ? "" : e.class) === c.name; })};
      }) : [{cls: null, rows: rows}];
    const body = [];
    groups.forEach(function (g) {
      if (g.cls) body.push(classHead(g.cls, cols.length));
      const flg = g.cls ? g.cls.fastest : fl;
      g.rows.forEach(function (e, i) {
        const v = g.cls ? {pos: e.class_pos, lapped: e.class_lapped, gap_s: e.class_gap_s, interval_s: e.class_interval_s,
                           gap_ms: e.class_gap_ms, interval_ms: e.class_interval_ms} : e;
        const done = e.finished && e.status !== "est";
        const tr = el("tr", done ? "" : e.status === "box" ? "box" : e.status === "retired" ? "off dnf"
                      : ["no_data", "dc", "no_sender"].indexOf(e.status) >= 0 ? "off" : "");
        const all = {
          pos: cell("pos", v.pos, "pos"), brand: brandCell(e), num: numCell(e), drv: driverCell(e), tyre: tyreCell(e),
          laps: cell("laps", e.laps), pits: cell("pits", e.pit_stops || 0),
          gap: cell("gap", quali ? (i ? plusMs(v.gap_ms) : typeof e.best_ms === "number" ? "Pole" : "")
                    : e.status === "est" ? estGap(v, i)
                    : e.finished ? finishedGap(v, i)
                    : STATUS[e.status] || (i === 0 ? "" : v.lapped ? "+" + v.lapped + " L"
                    : typeof v.gap_s === "number" ? "+" + v.gap_s.toFixed(1) : "")),
          int: cell("int", quali ? (i ? plusMs(v.interval_ms) : "")
                    : i && typeof v.interval_s === "number" ? "+" + v.interval_s.toFixed(1) : ""),
          last: cell("last", lapTime(e.last_lap_ms), quali ? qualiMark(e, i)
                     : flg && flg.entry === e.entry && flg.ms === e.last_lap_ms ? "fl" : ""),
          fuel: cell("fuel", typeof e.fuel_l === "number" ? e.fuel_l.toFixed(1) + " L" : ""),
          best: cell("best", lapTime(e.best_ms), i === 0 && typeof e.best_ms === "number" ? "fl" : ""),
        };
        cols.forEach(function (c) { tr.appendChild(all[c[0]]); });
        body.push(tr);
      });
    });
    $("timing").tBodies[0].replaceChildren(...body);
    $("state").hidden = rows.length > 0;
    $("fastest").replaceChildren();
    // Qualifying lists no fastest lap: the best lap column holds each driver's best.
    if (classes.length && !quali) {
      groups.forEach(function (g) {
        if (!g.cls.fastest) return;
        const name = el("span", "flcls", g.cls.name || "Unclassed");
        if (shade(g.cls.color)) name.style.color = shade(g.cls.color);
        const line = el("div");
        line.append(name, ...fastestText(g.cls.fastest));
        $("fastest").append(line);
      });
    } else if (fl && !quali) {
      $("fastest").append(...fastestText(fl));
    }
  }

  // Activity: what changed between two polls, newest on top.
  let seen = null;
  function note(text) {
    const row = el("div");
    const t = el("time", "", new Date().toLocaleTimeString([], {hour: "2-digit", minute: "2-digit"}));
    row.append(t, document.createTextNode(text));
    $("events").prepend(row);
    while ($("events").children.length > 30) $("events").lastChild.remove();
    $("feed").hidden = false;
  }
  function activity(d) {
    const now = {fl: d.fastest ? d.fastest.entry + "|" + d.fastest.ms : "", red: !!d.red_flag,
                 done: (d.entries || []).filter(function (e) { return e.finished; }).length};
    if (seen) {
      if (now.fl && now.fl !== seen.fl) note("Fastest lap " + lapTime(d.fastest.ms) + ": " + d.fastest.driver);
      if (now.red && !seen.red) note("Red flag");
      if (!now.red && seen.red) note("Restart");
      if (now.done && !seen.done) note("Chequered flag");
    }
    seen = now;
  }

  // The remaining time counts down locally only while the race timer runs.
  function tick() {
    const since = got ? Math.max(0, (Date.now() - got) / 1000) : 0;
    const left = $("left");
    if (left && last && typeof last.remaining === "number") {
      const run = last.remaining_running === true ? Math.floor(since + dataAge) : 0;
      left.textContent = clock(Math.max(0, last.remaining - run)) + " left";
    }
    const ageEl = $("age");
    if (ageEl && got) {
      const age = Math.round(since + dataAge);
      const delay = last && last.delay_s > 0 ? " · " + last.delay_s + " s delay" : "";
      const quiet = !publisherUp || (HOSTED && age > 20);
      ageEl.textContent = (quiet ? "relay reconnecting · " : "") + "updated " + age + " s ago" + delay;
      ageEl.className = quiet || age > 3 * interval + 2 ? "stale" : "";
    }
    if (HOSTED && !ended) maybeFallBack();
  }

  function showEnded() {
    ended = true;
    $("state").hidden = false;
    $("state").textContent = "This timing link has ended.";
  }
  function socketState() {
    return {failedReconnects: failed, sinceDropS: (Date.now() - droppedAt) / 1000,
            publisherUp: publisherUp, fallback: fallback};
  }
  function maybeFallBack() {
    if (LOGIC.fallbackDecision(socketState()) === "redirect") {
      ended = true;
      location.replace(LOGIC.fallbackTarget(fallback, "host"));
    }
  }
  function showUnavailable(stopped) {
    $("state").hidden = false;
    $("state").textContent = stopped ? "Timing link unavailable. Reload the page to try again."
                                     : "Timing link unavailable. Retrying every few minutes.";
  }
  function connect() {
    sock = new WebSocket(location.href.replace(/^http/, "ws").replace(/[?#].*$/, "").replace(/\/?$/, "/ws"));
    sock.onmessage = function (ev) {
      let m;
      try { m = JSON.parse(ev.data); } catch (e) { return; }
      if (m.t === "state") {
        if (!live && failed >= LOGIC.UNAVAILABLE_AFTER) $("state").textContent = "Waiting for timing data…";
        live = true; failed = 0;
        publisherUp = true;
        fallback = LOGIC.fallbackUrl(m.fallback);
        got = Date.now();
        dataAge = typeof m.age_s === "number" ? m.age_s : 0;
        render(m.data); activity(m.data);
      } else if (m.t === "brand") {
        const logo = LOGIC.brandMessage(m);
        if (!logo) return;
        if (hostedLogos[logo.key]) URL.revokeObjectURL(hostedLogos[logo.key]);
        hostedLogos[logo.key] = URL.createObjectURL(new Blob([logo.bytes], {type: "image/png"}));
        delete logoFailed[logo.key];
        if (last) render(last);
      } else if (m.t === "publisher") {
        publisherUp = m.up === true;
      } else if (m.t === "moved" && typeof m.to === "string" && /^https:\/\//.test(m.to)) {
        ended = true;
        location.replace(LOGIC.fallbackTarget(m.to, "moved"));
      } else if (m.t === "end") {
        showEnded();
      }
    };
    sock.onclose = function () {
      if (ended) return;
      // Losing a working socket starts the count; only attempts after it fail.
      if (live) { live = false; failed = 0; droppedAt = Date.now(); } else failed++;
      maybeFallBack();
      if (ended) return;
      const wait = LOGIC.reconnectDelayMs(socketState());
      if (wait === null) { ended = true; showUnavailable(true); return; }
      if (LOGIC.unavailable(socketState())) showUnavailable(false);
      setTimeout(connect, wait);
    };
  }

  function followMove(d) {
    const move = LOGIC.funnelMove(d, location.search, (Date.now() - loadedAt) / 1000);
    if (move) location.replace(move);
    return !!move;
  }
  async function poll() {
    let wait = 2000;
    try {
      const res = await fetch(DATA, {cache: "no-store", headers: etag ? {"If-None-Match": etag} : {}});
      const pace = parseFloat(res.headers.get("X-Poll-After"));
      if (pace >= 2) { interval = pace; wait = pace * 1000; }
      if (res.status === 429 && !(pace >= 2)) wait = 5000;
      else if (res.status === 403) { showEnded(); return; }
      else if (res.status === 304) {
        got = Date.now(); dataAge = parseFloat(res.headers.get("X-Data-Age")) || 0;
        if (last && followMove(last)) return;   // the dwell can end while the data stands still
        if (last) render(last);
      }
      else if (res.ok) {
        const d = await res.json();
        etag = res.headers.get("ETag");
        got = Date.now();
        dataAge = parseFloat(res.headers.get("X-Data-Age")) || 0;
        if (followMove(d)) return;
        render(d); activity(d);
      }
    } catch (e) { wait = 5000; }
    setTimeout(poll, wait);
  }
  switches();
  setInterval(tick, 1000);
  if (HOSTED) connect(); else poll();
</script>
</body>
</html>
