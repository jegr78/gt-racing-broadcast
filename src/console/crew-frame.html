<style>
  /* Shared by the Commentator Cockpit and the Race Control desk. A page marks each
     card with data-tab="<id> [<id> ...]" and declares its tabs on #crewTabs. At
     820 px and below the page shows one tab at a time and keeps the live strip on
     screen; above it the page's own grid is untouched. The tab rules wait for the
     script's body class, so a page whose script failed still shows every card. */
  .crewtabs, .livetimer { display: none; }
  @media (max-width: 820px) {
    body.crewtabs-on { padding-bottom: calc(60px + env(safe-area-inset-bottom)); }
    .livestrip { position: sticky; top: 0; z-index: 40; background: #0b0d10;
                 padding-bottom: 1px; }
    .livestrip .tally { margin: 8px 12px 0; padding: 10px 12px; font-size: 18px; }
    .livestrip .tally .sub { font-size: 12px; margin-top: 2px; }
    .livestrip .cue-critical { font-size: 17px; gap: 8px 12px; padding: 8px 12px; }
    .livestrip button { min-height: 44px; }
    .crewtabs-on .livetimer { display: block; text-align: center; font-weight: 700; font-size: 15px;
                 font-variant-numeric: tabular-nums; padding: 4px 0 6px; color: #cdd3da; }
    .crewtabs-on .livetimer:empty { display: none; }
    .crewtabs-on .crewtabs { display: flex; position: fixed; left: 0; right: 0; bottom: 0; z-index: 50;
                background: #14171c; border-top: 1px solid #232830;
                padding-bottom: env(safe-area-inset-bottom); }
    .crewtabs button { flex: 1; min-height: 56px; background: none; border: 0;
                       color: #9aa0a6; font: inherit; font-size: 13px; font-weight: 600;
                       cursor: pointer; }
    .crewtabs button[aria-selected="true"] { color: #fff; box-shadow: inset 0 3px 0 #3b82f6; }
    .crewtabs-on [data-tab]:not(.tab-on), .crewtabs-on .desk-only { display: none !important; }
    .wrap .card { margin-top: 0 !important; }
    header a, header button, .wrap button, .wrap select,
    .wrap input:not([type="range"]) { min-height: 44px; }
    .wrap input[type="range"] { height: 44px; }
  }
</style>
<script>
  (function () {
    var nav = document.getElementById('crewTabs');
    if (!nav) return;
    var tabs = JSON.parse(nav.getAttribute('data-tabs') || '[]');
    var key = 'crewTab:' + location.pathname;
    window.crewSelectTab = function crewSelectTab(id) {
      document.querySelectorAll('[data-tab]').forEach(function (el) {
        el.classList.toggle('tab-on', el.getAttribute('data-tab').split(' ').indexOf(id) >= 0);
      });
      nav.querySelectorAll('button').forEach(function (b) {
        b.setAttribute('aria-selected', b.getAttribute('data-id') === id ? 'true' : 'false');
      });
      try { localStorage.setItem(key, id); } catch (e) { /* private mode */ }
    };
    tabs.forEach(function (t) {
      var b = document.createElement('button');
      b.type = 'button'; b.setAttribute('role', 'tab');
      b.setAttribute('data-id', t[0]); b.textContent = t[1];
      b.addEventListener('click', function () { window.crewSelectTab(t[0]); window.scrollTo(0, 0); });
      nav.appendChild(b);
    });
    var saved = null;
    try { saved = localStorage.getItem(key); } catch (e) { /* private mode */ }
    var ids = tabs.map(function (t) { return t[0]; });
    window.crewSelectTab(ids.indexOf(saved) >= 0 ? saved : ids[0]);
    document.body.classList.add('crewtabs-on');
    // Mirror the race timer into the live strip, since its card is desktop-only.
    var src = document.getElementById('timer'), dst = document.getElementById('liveTimer');
    if (src && dst) {
      var copy = function () { dst.textContent = src.textContent.trim().replace(/^—$/, ''); };
      new MutationObserver(copy).observe(src, { childList: true, subtree: true, characterData: true });
      copy();
    }
  })();
</script>
<style>
  /* Graphic card: thumbnails, an in-page preview and, where the league allows it,
     a take button per graphic (GRAPHICS_TAKE). */
  #gfxHead { display: flex; align-items: center; justify-content: space-between; }
  #gfxRefresh { background: none; border: 0; color: #8ab4f8; cursor: pointer;
                font: inherit; font-size: 12px; padding: 0 4px; }
  #gfxList { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
             gap: 8px; padding: 10px 12px; }
  #gfxList .empty { grid-column: 1 / -1; font-size: 13px; opacity: .6; }
  .gtile { display: flex; flex-direction: column; background: #1b1f25;
           border: 2px solid #2a3038; border-radius: 8px; overflow: hidden; }
  .gtile.onair { border-color: #e5484d; }
  .gtile.asked { border-color: #d29922; }
  .gthumb { position: relative; display: block; width: 100%; padding: 0; border: 0;
            background: #000; cursor: zoom-in; }
  .gthumb img { display: block; width: 100%; aspect-ratio: 16/9; object-fit: contain; }
  .gnoprev { display: flex; align-items: center; justify-content: center; aspect-ratio: 16/9;
             font-size: 11px; color: #8a929c; }
  .gthumb:disabled { cursor: default; }
  .gbadge { position: absolute; top: 6px; left: 6px; background: #c1121f; color: #fff;
            font-size: 10px; font-weight: 800; letter-spacing: .06em; padding: 2px 6px;
            border-radius: 999px; }
  .gbadge.asked { background: #9a6700; }
  .gname { font-size: 12px; padding: 5px 6px 0; overflow-wrap: anywhere; }
  .gby { font-size: 11px; opacity: .6; padding: 0 6px; }
  .gtake { margin: 5px 6px 6px; padding: 5px 6px; border: 0; border-radius: 6px;
           background: #1d4ed8; color: #fff; font: inherit; font-size: 12px;
           font-weight: 700; cursor: pointer; }
  .gtake.off { background: #3a4250; }
  .gtake.ask { background: #9a6700; }
  .gtake:disabled { opacity: .45; cursor: default; }
  .gwhy { font-size: 11px; opacity: .6; padding: 0 6px 6px; margin-top: -2px; }
  #gfxMsg { font-size: 12px; padding: 0 12px 10px; min-height: 0; color: #ff6b6b; }
  #gfxMsg:empty { display: none; }
  .flaglist { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
              gap: 8px; padding: 10px 12px; }
  .flaglist button { min-height: 44px; border-radius: 8px; border: 2px solid transparent;
                     font: inherit; font-weight: 800; cursor: pointer; color: #111; }
  .flaglist button[aria-pressed="true"] { border-color: #fff; box-shadow: 0 0 0 3px #e5484d; }
  .flaglist .fon { display: block; font-size: 10px; letter-spacing: .08em; }
  .flaglist button:disabled { opacity: .45; cursor: default; }
  .gpreview { max-width: 960px; width: 94vw; border: 0; border-radius: 10px; padding: 0;
              background: #14171c; color: #e8eaed; }
  .gpreview::backdrop { background: rgba(0,0,0,.7); }
  .gpreview img { display: block; width: 100%; aspect-ratio: 16/9; object-fit: contain;
                  background: #000; }
  .gpreview .gpbar { display: flex; align-items: center; gap: 8px; padding: 10px 12px; }
  .gpreview .gpbar .gname { flex: 1; padding: 0; font-weight: 600; }
  .gpreview .gpbar button { min-height: 44px; padding: 0 14px; border-radius: 6px; border: 0;
                            font: inherit; font-weight: 700; cursor: pointer;
                            background: #1f2630; color: #e8eaed; }
  .gpreview .gpbar .gtake { margin: 0; background: #1d4ed8; color: #fff; }
  .gpreview .gpbar .gtake.off { background: #3a4250; }
  .gpreview .gpbar .gtake.ask { background: #9a6700; }
  @media (max-width: 820px) {
    #gfxList { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .gtake { min-height: 44px; font-size: 13px; }
    .gname { font-size: 13px; }
  }
</style>
<script>
  (function () {
    var box = document.getElementById('gfxList');
    if (!box) return;
    var FLAG_COLORS = { 'Flag Green': '#2bd66a', 'Flag Yellow': '#ffd60a', 'Flag Red': '#ff4d5e',
                        'Flag Safety Car': '#ffb300', 'Flag Virtual Safety Car': '#ffcf66' };
    var list = [], view = null, viewSig = '', busy = false;
    var msg = document.createElement('div');
    msg.id = 'gfxMsg'; msg.setAttribute('role', 'status');
    box.insertAdjacentElement('afterend', msg);
    var dlg = document.createElement('dialog');
    dlg.className = 'gpreview';
    document.body.appendChild(dlg);
    dlg.addEventListener('click', function (e) { if (e.target === dlg) dlg.close(); });

    function api(p) { return window.RC_API ? window.RC_API(p) : p; }
    function imgUrl(file) { return api('/graphics/' + encodeURIComponent(file)); }
    // Graphics are served no-store, so a rebuilt tile reuses its image element
    // instead of downloading the still again.
    var imgs = {};
    function imgFor(file, kind) {
      var key = kind + ':' + file;
      if (!imgs[key]) {
        var img = el('img'); img.alt = ''; img.src = imgUrl(file);
        if (kind === 'thumb') img.loading = 'lazy';
        imgs[key] = img;
      }
      return imgs[key];
    }
    function el(tag, cls, text) {
      var e = document.createElement(tag);
      if (cls) e.className = cls;
      if (text != null) e.textContent = text;
      return e;
    }
    function takeOf(name) {
      return view ? (view.graphics || []).filter(function (g) { return g.source === name; })[0] : null;
    }
    // A take needs the graphic's scene on air; hiding it does not.
    function blockedReason(t) {
      if (t.visible || !view || !view.program_scene) return '';
      return t.scenes.indexOf(view.program_scene) >= 0 ? '' : t.scenes.join(' / ') + ' is not on air';
    }
    var REQUEST_NOTE = { declined: 'Declined by the director', expired: 'Request expired' };
    // The tile's one action: hide, take, or ask the director, by the caller's rights.
    function actionButton(t) {
      var b;
      if (t.visible) {
        if (!t.can_hide) return null;
        b = el('button', 'gtake off', 'Take off air');
        b.addEventListener('click', function (e) { e.stopPropagation(); take(t.source, false); });
      } else if (t.can_take) {
        b = el('button', 'gtake', 'Put on air');
        var why = blockedReason(t);
        if (why) { b.disabled = true; b.title = why; }
        b.addEventListener('click', function (e) { e.stopPropagation(); take(t.source, true); });
      } else if (t.can_request) {
        var asked = t.request === 'pending';
        b = el('button', 'gtake ask', asked ? 'Requested' : 'Request');
        if (asked) b.disabled = true;
        b.addEventListener('click', function (e) { e.stopPropagation(); ask(t.source); });
      } else {
        return null;
      }
      b.type = 'button';
      if (busy) b.disabled = true;
      return b;
    }
    function tileNote(t) {
      if (t.visible) return '';
      if (t.can_take) return blockedReason(t);
      return t.can_request ? (REQUEST_NOTE[t.request] || '') : '';
    }
    function openPreview(g) {
      var t = takeOf(g.name);
      dlg.textContent = '';
      var img = imgFor(g.file, 'big');
      var bar = el('div', 'gpbar');
      bar.appendChild(el('div', 'gname', g.name));
      var act = t && actionButton(t);
      if (act) bar.appendChild(act);
      var close = el('button', '', 'Close'); close.type = 'button';
      close.addEventListener('click', function () { dlg.close(); });
      bar.appendChild(close);
      dlg.append(img, bar);
      if (!dlg.open) dlg.showModal();
    }
    // A takeable graphic the Sheet list hides (internal or still a placeholder)
    // still gets a tile, without a preview, so the crew can put it on air.
    function tiles() {
      var names = list.map(function (g) { return g.name; });
      var extra = view ? (view.graphics || []).filter(function (t) {
        return t.group === 'editorial' && (t.can_take || t.can_request) && names.indexOf(t.source) < 0;
      }).map(function (t) { return { name: t.source, file: null }; }) : [];
      return list.concat(extra);
    }
    function render() {
      box.textContent = '';
      var all = tiles();
      if (!all.length) { box.appendChild(el('div', 'empty', 'No graphics available.')); }
      all.forEach(function (g) {
        var t = takeOf(g.name);
        var asked = t && !t.visible && t.request === 'pending';
        var tile = el('div', 'gtile' + (t && t.visible ? ' onair' : asked ? ' asked' : ''));
        var thumb = el('button', 'gthumb'); thumb.type = 'button';
        if (g.file) {
          thumb.setAttribute('aria-label', 'Preview ' + g.name);
          thumb.appendChild(imgFor(g.file, 'thumb'));
          thumb.addEventListener('click', function () { openPreview(g); });
        } else {
          thumb.disabled = true;
          thumb.appendChild(el('span', 'gnoprev', 'No preview'));
        }
        if (t && t.visible) thumb.appendChild(el('span', 'gbadge', 'ON AIR'));
        else if (asked) thumb.appendChild(el('span', 'gbadge asked', 'REQUESTED'));
        tile.append(thumb, el('div', 'gname', g.name));
        if (t && t.visible && t.by) tile.appendChild(el('div', 'gby', 'by ' + t.by));
        var act = t && actionButton(t);
        if (act) tile.appendChild(act);
        var note = t ? tileNote(t) : '';
        if (note) tile.appendChild(el('div', 'gwhy', note));
        box.appendChild(tile);
      });
      renderFlags();
      if (dlg.open) {
        var name = dlg.querySelector('.gname');
        var g = name && list.filter(function (x) { return x.name === name.textContent; })[0];
        if (g) openPreview(g);
      }
    }
    function renderFlags() {
      var card = document.getElementById('flagCard'), fl = document.getElementById('flagList');
      if (!card || !fl) return;
      var flags = view ? (view.graphics || []).filter(function (g) { return g.group === 'flag' && g.can_take; }) : [];
      card.hidden = !flags.length;
      fl.textContent = '';
      flags.forEach(function (t) {
        var b = el('button', '', t.source.replace(/^Flag /, ''));
        b.type = 'button';
        if (t.visible) b.appendChild(el('span', 'fon', 'ON AIR'));
        b.style.background = FLAG_COLORS[t.source] || '#cdd3da';
        b.setAttribute('aria-pressed', t.visible ? 'true' : 'false');
        var why = blockedReason(t);
        b.disabled = busy || !!why;
        b.title = why || (t.visible ? 'Take ' + t.source + ' off air' : 'Put ' + t.source + ' on air');
        b.addEventListener('click', function () { take(t.source, !t.visible); });
        fl.appendChild(b);
      });
    }
    // The first requests of a page load sometimes meet a reset connection; one
    // quick retry saves a poll interval of empty card.
    function retryOnce(fn, retried) { if (!retried) setTimeout(function () { fn(true); }, 1000); }
    function loadList(retried) {
      return fetch('/graphics', { cache: 'no-store' })
        .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
        .then(function (d) { list = d.graphics || []; imgs = {}; render(); })
        .catch(function () {
          box.textContent = ''; box.appendChild(el('div', 'empty', 'Could not load graphics.'));
          retryOnce(loadList, retried);
        });
    }
    function loadView(retried) {
      return fetch('/cockpit/graphic-takes', { cache: 'no-store' })
        .then(function (r) { return r.ok ? r.json() : null; })
        .then(function (d) {
          var sig = JSON.stringify(d);
          if (sig === viewSig) return;     // unchanged: keep the tiles and their images
          viewSig = sig; view = d; render();
        })
        .catch(function () { retryOnce(loadView, retried); });
    }
    function send(path, body) {
      busy = true; msg.textContent = ''; render();
      fetch(path, { method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body) })
        .then(function (r) { return r.json().catch(function () { return {}; }).then(function (d) {
          if (!r.ok || !d.ok) msg.textContent = d.error || ('Failed (' + r.status + ')');
        }); })
        .catch(function () { msg.textContent = 'Network error.'; })
        .then(function () { busy = false; return loadView(); });
    }
    function take(source, on) { send('/cockpit/graphic-takes', { source: source, on: on }); }
    function ask(source) { send('/cockpit/graphic-takes/request', { source: source }); }
    var refresh = document.getElementById('gfxRefresh');
    if (refresh) refresh.addEventListener('click', function () { loadList(true); loadView(true); });
    loadList(); loadView();
    setInterval(function () { if (!busy && !document.hidden) loadView(true); }, 3000);
  })();
</script>
