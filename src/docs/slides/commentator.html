<span class="role-tag">Commentator · Onboarding</span>
# Commentator
You stream your stint on your own channel; the producer's relay pulls it in.

Note: Welcome to the commentator onboarding. Your role is simple: you stream your stint on your own channel, and the producer's relay pulls it into the broadcast. Let's walk through how to set up your stream and use your console.
</script></section>

<section data-markdown><script type="text/template">
## What the producer needs from you
Before race day, give your league/producer:

- Your **Discord handle**. Used to match your Console login (without it, Discord
  sign-in won't recognise you).
- Your **channel name** (the same YouTube/Twitch channel every event).

These go into the league's Crew tab so your login and your stints map to you.

Note: Before race day, give your league or producer two things. First, your Discord handle, which is used to match your Console login, without it, Discord sign-in won't recognise you. Second, your channel name, the same YouTube or Twitch channel you use every event. These go into the league's Crew tab so your login and your stints map to you.
</script></section>

<section data-markdown><script type="text/template">
## Stream settings
- Platform: your own **YouTube** or **Twitch**, set to **Unlisted**, the **same channel** every event.
- Latency: **Low** (not Ultra-low). Buffering protection lives on the producer side.
- Resolution: **1080p** target; if upload can't hold it, drop to **720p, never below**.
- **CBR**, 2 s keyframes; use a **hardware encoder** (NVENC / QuickSync / AMF).
- **No personal overlays**: graphics are added centrally.

More: [Who does what](https://github.com/jegr78/gt-racing-broadcast/wiki/Who-does-what)

Note: Here are your stream settings. Use your own YouTube or Twitch, set to Unlisted, on the same channel every event. Set latency to Low, not Ultra-low. Buffering protection lives on the producer side. Aim for ten eighty p; if your upload can't hold it, drop to seven twenty p, but never below. Use constant bitrate with two second keyframes, and a hardware encoder such as NVENC, QuickSync or AMF. And add no personal overlays. Graphics are added centrally.
</script></section>

<section data-markdown><script type="text/template">
## Streaming from a PlayStation (no PC)
- **PS5:** 1080p60 to YouTube or Twitch; pick **Unlisted** right on the console.
- **PS4 Pro:** 1080p. **Base PS4:** 720p. Still fine (never below 720p).
- **Latency: set once, beforehand** on the channel (the console has no latency knob):
  - YouTube Studio → Settings → stream latency → **Low**.
  - Twitch Creator Dashboard → Stream → **Low Latency** on (default).
- No CBR / keyframe / encoder knobs on the console. Just set resolution and privacy.

More: [Who does what](https://github.com/jegr78/gt-racing-broadcast/wiki/Who-does-what)

Note: You can also stream straight from a PlayStation with no PC. On a PS5, stream ten eighty p sixty to YouTube or Twitch, and pick Unlisted right on the console. A PS4 Pro does ten eighty p, and a base PS4 does seven twenty p, which is still fine. Just never below seven twenty p. The console has no latency knob, so set it once beforehand on the channel: in YouTube Studio, under Settings, stream latency, choose Low; in the Twitch Creator Dashboard, under Stream, turn Low Latency on, which is the default. There are no bitrate, keyframe or encoder knobs on the console. Just set resolution and privacy.
</script></section>

<section data-markdown><script type="text/template">
## Open your Console
Sign in at the Console link your producer shares, with Discord, or a personal sign-in link.
Your cockpit appears as one of the role-gated cards.

![The Console launcher](assets/img/console-landing.png)

More: [Console](https://github.com/jegr78/gt-racing-broadcast/wiki/Console) · [Commentator Cockpit](https://github.com/jegr78/gt-racing-broadcast/wiki/Commentator-Cockpit)

Note: To open your console, sign in at the Console link your producer shares. Either with Discord, or with a personal sign-in link. Once you're in, your cockpit appears as one of the role-gated cards on the launcher.
</script></section>

<section data-markdown><script type="text/template">
## Send your watch link
- **Preferred:** submit it from your **cockpit**. Pick your stint, paste the URL, and submit.
- It lands as a **pending request** the director approves before it can go on air.
- You can only ever touch your **own** stints, never anyone else's.
- **Alternative:** post your `youtube.com/watch?v=…` / `twitch.tv/<you>` link in the crew **Discord** before your stint.

Note: Now send your watch link. The preferred way is to submit it from your cockpit. Pick your stint, paste the URL, and submit. It lands as a pending request that the director approves before it can go on air, and you can only ever touch your own stints, never anyone else's. As an alternative, post your YouTube or Twitch link in the crew Discord before your stint.
</script></section>

<section data-markdown><script type="text/template">
## Your cockpit
- **Header**: the event title, and a **Notes** button when the league posted notes or documents.
- **Tally**: large **YOU ARE ON AIR**, or **UP NEXT · stint N · in X handovers**.
- **Program**: the live broadcast picture, program audio and the public broadcast chat.
- **Talk**: crew chat, **Message director** and the **Race Control** notes.
- **Timing** and **Stint plan**: the driver race and every stint with its streamer.
- **Race timer**, **stream-link submission** and the broadcast **Graphics**.

More: [Commentator Cockpit](https://github.com/jegr78/gt-racing-broadcast/wiki/Commentator-Cockpit)

Note: Your cockpit gives you everything on one page. The header shows the event title, and a Notes button when the league posted notes or documents. The tally shows a large "you are on air" indicator, or "up next" with your stint number and how many handovers away you are. The program area shows the live broadcast picture, the program audio and the public broadcast chat. The talk area holds the crew chat, a card to message the director, and the notes from Race Control. Then there is the timing of the driver race, the stint plan, the race timer, the stream-link form and the broadcast graphics. The next slides go through them one by one.
</script></section>

<section data-markdown><script type="text/template">
## What you see

![Commentator Cockpit](assets/img/console-cockpit.png)

Tally on top. Program and broadcast chat, timer, Message director, Race Control, Timing, Stint plan and Graphics below.

Note: This is the cockpit on a desktop screen. The tally runs across the top. Below it sit the program picture with its audio button, the broadcast chat, the crew chat and the stream-link form. The right column holds the race timer, Message director, the Race Control notes, the timing table, the stint plan and the graphics.
</script></section>

<section data-markdown><script type="text/template">
## Program and broadcast chat
- **Program monitor**: low-bandwidth stills of the real broadcast output.
- **Audio**: when the relay offers program audio, a button and a volume slider play the on-air sound.
- A yellow note **"Program is N s behind live"** means the producer's machine lags. Your stream is fine.
- **Broadcast chat**: a read-only mirror of the public YouTube or Twitch chat. **Write in YouTube chat** opens the platform chat in a pop-up.

More: [Commentator Cockpit](https://github.com/jegr78/gt-racing-broadcast/wiki/Commentator-Cockpit)

Note: The program monitor shows low-bandwidth stills of the real broadcast output. When the producer's relay offers program audio, an Audio button and a volume slider under the picture play the on-air sound. If a yellow note says the program is some seconds behind live, the producer's machine has fallen behind. The delay is on the producer side, not in your stream. Next to the picture, the broadcast chat mirrors the public YouTube or Twitch chat. It is read-only. To write in it, the button opens the platform's own chat in a pop-up window.
</script></section>

<section data-markdown><script type="text/template">
## Talk to the director and Race Control
- **Message director**: tap a preset, **Ready**, **Need 2 min**, **Come to me** or **Wrap me up?**, or type up to 200 characters and press **Send**.
- The director sees it in the Director Panel with your name. The relay sets the name from your sign-in.
- **Race Control** card: notes the Race Control desk sends to the commentators, listed with their time.
- A new Race Control note also flashes briefly at the top of the page.

More: [Commentator Cockpit](https://github.com/jegr78/gt-racing-broadcast/wiki/Commentator-Cockpit#message-director)

Note: You can talk back to the director. In the Message director card, tap a preset such as Ready, Need two minutes, Come to me, or Wrap me up, or type a short note of up to two hundred characters and press Send. The director sees it in the Director Panel with your name. The relay takes the name from your sign-in, so nobody can send under another name. The Race Control card collects the notes the Race Control desk sends to the commentators. They stay in the card with their time, and a new note also flashes briefly at the top of the page.
</script></section>

<section data-markdown><script type="text/template">
## Director cues
Directors send short text cues to your cockpit. A text-only stand-in for an earpiece.

- **Info**: brief auto-fading toast at the top; disappears after **30 seconds** on its own.
- **Critical**: sticky banner that stays on screen until you click **Acknowledge**; the director then sees a **✓ seen** stamp.
- Cues are **visual only**. There is no sound. Keep the cockpit open on a visible
  screen so you notice a critical banner.

You only receive cues addressed to you by name or to **All commentators**.

More: [Commentator Cockpit](https://github.com/jegr78/gt-racing-broadcast/wiki/Commentator-Cockpit)

Note: Directors send short text cues to your cockpit. A text-only stand-in for an earpiece. An Info cue is a brief toast at the top that fades away on its own after thirty seconds. A Critical cue is a sticky banner that stays on screen until you click Acknowledge, after which the director sees a "seen" stamp. Cues are visual only. There is no sound, so keep the cockpit open on a visible screen to notice a critical banner. You only receive cues addressed to you by name, or to All commentators.
</script></section>

<section data-markdown><script type="text/template">
## Timing and stint plan
- **Timing** appears once a car sends telemetry. It shows the same delayed data as the on-air driver dashboard.
- Every column at once: position, brand logo, number, driver and team, tyre, laps, gap, interval, last lap, fuel and pit stops.
- In a multiclass event the table groups the cars under a header per class and lists the fastest lap of each class.
- **Stint plan**: every stint with its streamer. Your own stints are marked, the stint on air is highlighted.

More: [Driver telemetry](https://github.com/jegr78/gt-racing-broadcast/wiki/Driver-Telemetry#on-air-and-in-the-cockpit)

Note: The Timing card appears as soon as a car sends telemetry. Until then it stays hidden, even when the league lists its entries. It shows the same delayed race as the on-air driver dashboard, so it matches what viewers see. Unlike the broadcast overlay, it shows every column at once, with the brand logos, the tyre compound, the gaps, the last lap and the fuel. In an event with several car classes, the table groups the cars under a header per class, and lists the fastest lap of each class. Below it, the stint plan lists every stint with its streamer. Your own stints are marked, and the stint on air is highlighted.
</script></section>

<section data-markdown><script type="text/template">
## Graphics
- Tap a tile to see the graphic large in the page. A red frame with **ON AIR** means it is in the broadcast now.
- The league decides with `GRAPHICS_TAKE`. Unset, the tiles are for reference only.
- `direct`: **Put on air** and **Take off air**. One crew graphic at a time; the director's graphics stay untouched.
- `request`: **Request** asks the director, who takes or declines it. A request expires after 60 seconds.
- Commentators never set the flag graphics. The director keeps every control.

More: [Console: Graphics](https://github.com/jegr78/gt-racing-broadcast/wiki/Console#graphics)

Note: The Graphics card shows the league's broadcast stills as tiles. Tap a tile to see the graphic large in the page. A tile with a red frame and the words on air is in the broadcast right now. Whether you may put a graphic on air is the league's choice, set with GRAPHICS TAKE. If the league leaves it unset, the tiles are for reference only. In direct mode each graphic gets Put on air and Take off air. Only one crew graphic is on air at a time, and graphics the director put on air are never touched. In request mode the button says Request. The director takes or declines it, and an unanswered request expires after sixty seconds. Commentators never set the flag graphics, and the director keeps every control in the panel.
</script></section>

<section data-markdown><script type="text/template">
## On a phone
At 820 px and below, a tab bar at the bottom shows one part of the cockpit at a time:

- **Talk**: Message director, crew chat, Race Control notes.
- **Program**: picture, audio, broadcast chat.
- **Graphics**: the graphic tiles.
- **Plan**: timing, stint plan, stream-link submission.

The on-air banner, the race timer and a critical cue stay at the top while you scroll. The page remembers the last tab.

More: [Console: On a phone](https://github.com/jegr78/gt-racing-broadcast/wiki/Console#on-a-phone)

Note: On a phone, or any screen of eight hundred twenty pixels or less, a tab bar at the bottom shows one part of the cockpit at a time. Talk holds Message director, the crew chat and the Race Control notes. Program holds the picture, the audio and the broadcast chat. Graphics holds the graphic tiles. Plan holds the timing, the stint plan and the stream-link form. The on-air banner, the race timer and a critical director cue stay at the top while you scroll, and the page remembers the last tab you used.
</script></section>

<section data-markdown><script type="text/template">
## Event notes, documents and health
- **Notes** in the header opens the league's event notes and document links, in two tabs.
- Documents open in a new browser tab. The button hides when the league posted neither.
- The **Health Monitor** card on the Console launcher shows how the relay runs, live and over time. It is read-only.

<img src="assets/img/event-info-documents.png" alt="Notes dialog with Notes and Documents tabs" style="max-height:260px">

More: [Sheet template: Event Notes](https://github.com/jegr78/gt-racing-broadcast/wiki/Sheet-Template#event-notes-tab) · [Health Monitor](https://github.com/jegr78/gt-racing-broadcast/wiki/Health-Monitor)

Note: Two more things on the page and the launcher. The Notes button in the header opens the league owner's event notes and document links, such as the rulebook, in two tabs. A document opens in a new browser tab. When the league posted neither notes nor documents, the button hides. And every signed-in crew member sees a Health Monitor card on the Console launcher. It shows how the producer's relay has been running, live and over time. It is read-only and changes nothing on air.
</script></section>

<section data-markdown><script type="text/template">
## Recap / Go deeper
- Set your channel to **Unlisted**, **Low** latency, and no personal overlays.
- Open the **Console** link the producer shares and sign in.
- Watch the **tally**. You'll know the moment you go on air or are up next.
- Acknowledge any **Critical** cues promptly. **Message director** sends a note back.

Note: To recap and go deeper: set your channel to Unlisted, with Low latency and no personal overlays. Open the Console link the producer shares and sign in. Watch the tally. You'll know the moment you go on air or are up next. Acknowledge any Critical cues promptly. And Message director sends a note back to the director. That's everything you need to commentate.
