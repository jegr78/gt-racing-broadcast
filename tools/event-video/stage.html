<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Event walkthrough stage</title>
<style>
@font-face{font-family:'Saira Condensed';src:url('../fonts/SairaCondensed.woff2') format('woff2');font-weight:100 900;font-display:block}
@font-face{font-family:'IBM Plex Mono';src:url('../fonts/IBMPlexMono.woff2') format('woff2');font-weight:400;font-display:block}
:root{--navy0:#0e151f;--navy1:#141f2c;--teal:#35a7cc;--teal2:#48c2e6;--ink:#eef3f7;--muted:#8fa0b0}
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:#05080c;overflow:hidden}
/* No transitions or animations: every frame is a pure function of its state. */
#stage{position:relative;width:2560px;height:1440px;overflow:hidden;color:var(--ink);font-family:'Saira Condensed',sans-serif;
  background:radial-gradient(120% 90% at 78% 12%,rgba(53,167,204,.14),transparent 55%),
             linear-gradient(160deg,var(--navy1) 0%,var(--navy0) 60%,#0b1119 100%)}
#topbar{position:absolute;display:flex;align-items:center;gap:24px;padding:0 32px;
  background:linear-gradient(90deg,rgba(53,167,204,.18),transparent 70%);border-bottom:2px solid rgba(53,167,204,.35)}
#chapterNo{font-family:'IBM Plex Mono',monospace;font-size:28px;color:var(--teal2);letter-spacing:.2em}
#chapterTitle{font-size:54px;font-weight:800;font-style:italic;text-transform:uppercase;letter-spacing:.01em}
#topbar.fresh #chapterTitle{color:var(--teal2)}
#topbar.fresh{background:linear-gradient(90deg,rgba(53,167,204,.42),transparent 80%)}
#right{margin-left:auto;display:flex;align-items:center;gap:28px}
#ff{font-family:'IBM Plex Mono',monospace;font-size:30px;color:#05080c;background:var(--teal2);border-radius:100px;padding:4px 20px}
#ff:empty{display:none}
#clockLabel{font-family:'IBM Plex Mono',monospace;font-size:20px;color:var(--muted);letter-spacing:.24em}
#clock{font-family:'IBM Plex Mono',monospace;font-size:48px}
.view{position:absolute}
.view .pic{position:absolute;inset:0;overflow:hidden;border-radius:0 10px 10px 10px;background:#000;box-shadow:0 12px 40px rgba(0,0,0,.55)}
.view video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:none}
.view video.on{display:block}
.view .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--muted);
  font-family:'IBM Plex Mono',monospace;font-size:16px;background:var(--navy1)}
.view.has .ph{display:none}
/* The role label is a tab above the picture, so it never covers a page's own heading. */
.view .label{position:absolute;left:0;bottom:100%;padding:0 12px;font-weight:700;letter-spacing:.02em;white-space:nowrap;
  color:var(--ink);background:#1b2a3a;border-radius:8px 8px 0 0}
.view.ring .label{background:var(--teal2);color:#05080c}
.view .ring{position:absolute;inset:0;border:5px solid var(--teal2);border-radius:0 10px 10px 10px;display:none;
  box-shadow:inset 0 0 24px rgba(72,194,230,.55)}
.view.ring .ring{display:block}
#caption{position:absolute;display:flex;align-items:center;gap:24px;padding:0 28px;border-radius:12px;
  background:rgba(5,8,12,.86);border:1px solid rgba(53,167,204,.35)}
#who{font-size:34px;font-weight:700;color:#05080c;background:var(--teal2);border-radius:8px;padding:2px 16px;white-space:nowrap}
#who:empty{display:none}
#text{font-size:50px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
</style>
</head>
<body>
<div id="stage">
  <div id="topbar"><span id="chapterNo"></span><span id="chapterTitle"></span>
    <div id="right"><span id="ff"></span><span id="clockLabel">EVENT TIME</span><span id="clock"></span></div></div>
  <div id="caption"><span id="who"></span><span id="text"></span></div>
</div>
<script>
const views = {};
const box = (el, r) => { el.style.left = r[0] + 'px'; el.style.top = r[1] + 'px'; el.style.width = r[2] + 'px'; el.style.height = r[3] + 'px'; };

const READY_MS = 20000;
const SEEK_MS = 10000;

/* Resolves true once the video knows its duration, false on an error or a timeout. */
function ready(v) {
  return new Promise(res => {
    if (v.readyState >= 1) return res(true);
    const t = setTimeout(() => res(false), READY_MS);
    v.addEventListener('loadedmetadata', () => { clearTimeout(t); res(true); }, {once: true});
    v.addEventListener('error', () => { clearTimeout(t); res(false); }, {once: true});
  });
}

async function setup(cfg) {
  const stage = document.getElementById('stage');
  box(document.getElementById('topbar'), cfg.topbar);
  box(document.getElementById('caption'), cfg.caption);
  for (const v of cfg.views) {
    const el = document.createElement('div');
    el.className = 'view';
    el.dataset.view = v.id;
    const ph = document.createElement('div');
    ph.className = 'ph';
    ph.textContent = 'not open yet';
    const label = document.createElement('div');
    label.className = 'label';
    label.textContent = v.label;
    const ring = document.createElement('div');
    ring.className = 'ring';
    const pic = document.createElement('div');
    pic.className = 'pic';
    pic.append(ph, ring);
    el.append(pic, label);
    stage.insertBefore(el, document.getElementById('caption'));
    views[v.id] = {el, pic, ring, videos: {}, label};
  }
  const waits = [];
  for (const r of cfg.recordings) {
    if (!r.url) continue;
    const video = document.createElement('video');
    video.muted = true;
    video.preload = 'metadata';
    video.src = r.url;
    const view = views[r.view];
    view.pic.insertBefore(video, view.ring);
    view.videos[r.index] = video;
    waits.push(ready(video).then(ok => { video.dataset.bad = ok ? '' : '1'; }));
  }
  await Promise.all(waits);
  await document.fonts.ready;
}

/* Resolves true once the video shows time t, false when the seek does not land. */
function seek(video, t) {
  if (Number.isFinite(video.duration)) t = Math.min(t, Math.max(0, video.duration - 0.001));
  if (Math.abs(video.currentTime - t) < 0.0005 && video.readyState >= 2) return Promise.resolve(true);
  return new Promise(res => {
    const done = setTimeout(() => res(false), SEEK_MS);
    video.addEventListener('seeked', () => { clearTimeout(done); res(true); }, {once: true});
    video.currentTime = t;
  });
}

/* Shows frame state s. Returns {ok, problems}: ok only when every shown view's video
   loaded and landed on its time, so a capture never encodes a stale frame. */
async function setFrame(s) {
  const seeks = [];
  const problems = [];
  for (const [id, view] of Object.entries(views)) {
    const r = s.rects[id];
    box(view.el, r);
    view.el.style.opacity = r[4];
    view.label.style.height = view.label.style.lineHeight = r[5] + 'px';
    view.label.style.fontSize = Math.round(r[5] * 0.68) + 'px';
    view.el.classList.toggle('ring', s.rings.includes(id) && r[4] > 0);
    view.el.classList.toggle('large', s.large.includes(id));
    const src = s.sources[id];
    const video = src ? view.videos[src[0]] : null;
    for (const v of Object.values(view.videos)) v.classList.toggle('on', v === video);
    const broken = !!video && (!!video.error || video.dataset.bad === '1' || video.readyState < 1);
    view.el.classList.toggle('has', !!video && !broken);
    if (!src || r[4] <= 0) continue;
    if (!video) problems.push(`${id}: recording ${src[0]} is not on the stage`);
    else if (broken) problems.push(`${id}: recording ${src[0]} did not load`);
    else seeks.push(seek(video, src[1]).then(ok => {
      if (!ok) problems.push(`${id}: the seek to ${src[1]} s did not land`);
      else if (video.readyState < 2) problems.push(`${id}: no picture at ${src[1]} s`);
    }));
  }
  const top = document.getElementById('topbar');
  document.getElementById('chapterNo').textContent = s.chapter_no ? String(s.chapter_no).padStart(2, '0') : '';
  document.getElementById('chapterTitle').textContent = s.chapter || '';
  top.classList.toggle('fresh', !!s.chapter_fresh);
  document.getElementById('clock').textContent = s.clock;
  document.getElementById('ff').textContent = s.ff ? '\u25B6\u25B6 ' + s.ff : '';
  document.getElementById('who').textContent = s.caption && s.who ? s.who : '';
  document.getElementById('text').textContent = s.caption || '';
  await Promise.all(seeks);
  await new Promise(res => requestAnimationFrame(() => requestAnimationFrame(res)));
  return {ok: problems.length === 0, problems};
}
</script>
</body>
</html>
