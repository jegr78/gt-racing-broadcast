# Smoke run: every role acts once. The producer picks the track and starts the event in
# the Control Center, a commentator submits a stream link in the cockpit, the director
# approves it, puts stint 1 on air, shows a graphic, sets a HUD field and starts Part 1
# on the Director Panel, four drivers register and
# Race Control approves them on its desk, they race two laps, a viewer reads the public
# timing, Race Control calls the final lap and the producer stops the event.
description = "Smoke run: each role once, from Start event to Stop event."
max_minutes = 10

[event]
stints = 3
track = "6e378b"
track_length_m = 1200
cars = 4
seed = 7
parts = 2

[[event.commentators]]
name = "Comms 1"
channel = "comms1"
scheduled = true

[[event.commentators]]
name = "Comms 2"
channel = "comms2"

[[event.commentators]]
name = "Comms 3"
channel = "comms3"
scheduled = true

[[step]]
id = "relay_up"
role = "api"
do = "get"
args = { path = "/status" }
expect = ["relay.up"]
shot = { name = "program-start", role = "obs" }

[[step]]
id = "cc_status"
role = "api"
do = "get"
args = { service = "ui", path = "/api/status" }
expect = ["result('cc_status').relay.port == relay.port", "result('cc_status').relay.alive",
          "result('cc_status').relay.http_ok", "result('cc_status').relay.mode == 'simulation'",
          "result('cc_status').simulation"]

[[step]]
id = "track"
at = "after:cc_status"
role = "producer"
do = "pick_track"

[[step]]
id = "race_settings"
at = "after:track"
role = "producer"
do = "race_settings"
args = { formation = false, finish_mode = "time" }
expect = ["not race.settings.formation", "race.settings.finish_mode == 'time'"]

[[step]]
id = "start_event"
at = "after:race_settings"
role = "producer"
do = "start_event"
expect = ["obs.scene == 'Standby'", "relay.up", "race.track == '6e378b'"]
shot = "control-center"

# Start event must reuse the simulation's relay, never start one on the live ports.
[[step]]
id = "same_relay"
at = "after:start_event"
role = "api"
do = "get"
args = { service = "ui", path = "/api/status" }
expect = ["result('same_relay').relay.pid == result('cc_status').relay.pid",
          "result('same_relay').relay.port == relay.port"]

[[step]]
id = "submit"
at = "after:start_event"
role = "commentator:Comms 2"
do = "submit_link"
args = { url = "sim://comms2", stint = 2 }
expect = ["webhook.count('submission') == 1", "page('commentator:Comms 2').pending != ''"]
shot = "cockpit-submitted"

[[step]]
id = "approve"
at = "after:submit"
role = "director"
do = "approve_link"
args = { stint = 2 }
expect = ["sheet.write_count('schedule') == 1",
          "sheet.schedule[1].url == 'sim://comms2'",
          "webhook.count('stream link approved') == 1"]
timeout = "15s"

[[step]]
id = "arm"
at = "after:approve"
role = "director"
do = "arm_feed"
args = { feed = "A" }

[[step]]
id = "on_air"
at = "after:arm"
role = "director"
do = "scene"
args = { scene = "Stint" }
expect = ["obs.scene == 'Stint'", "'comms1' in obs.program_channels"]
timeout = "90s"
shot = { name = "program-stint1", role = "obs" }

[[step]]
id = "graphic"
at = "after:on_air"
role = "director"
do = "graphic"
args = { name = "Standings", on = true }

[[step]]
id = "graphic_item"
at = "after:graphic"
role = "obs"
do = "request"
args = { type = "GetSceneItemId", data = { sceneName = "Stint", sourceName = "Standings" } }

[[step]]
id = "graphic_shown"
at = "after:graphic_item"
role = "obs"
do = "request"
args = { type = "GetSceneItemEnabled", data = { sceneName = "Stint", sceneItemId = "${graphic_item.sceneItemId}" } }
expect = ["result('graphic_shown').sceneItemEnabled"]

[[step]]
id = "hud"
at = "after:graphic_shown"
role = "director"
do = "hud"
args = { field = "racecontrol", value = "GREEN" }
expect = ["relay.get('/setup/data').fields.racecontrol == 'GREEN'"]

[[step]]
id = "go_live"
at = "after:hud"
role = "director"
do = "start_part"
expect = ["obs.streaming"]

[[step]]
id = "register"
at = "after:go_live"
role = "drivers"
do = "register"
args = { stints = 1 }
expect = ["result('register').registered == 4"]

# The race controls stay in reach at 1440x900 however many requests wait (#1267).
[[step]]
id = "desk_waiting"
at = "after:register"
role = "race_control"
do = "open"
expect = ["page('race_control').waiting == 4"]
timeout = "15s"

[[step]]
id = "desk_fit_waiting"
at = "after:desk_waiting"
role = "race_control"
do = "fit"

[[step]]
id = "approve_drivers"
at = "after:desk_fit_waiting"
role = "race_control"
do = "approve_drivers"
expect = ["result('approve_drivers').approved == 4", "page('race_control').waiting == 0"]

[[step]]
id = "green"
at = "after:approve_drivers"
role = "drivers"
do = "start"
expect = ["race.state == 'racing'", "page('drivers').driving == 4"]
timeout = "60s"
shot = { name = "director-panel", role = "director" }

[[step]]
id = "lap2"
at = "after:green"
role = "api"
do = "get"
args = { path = "/drivers/race" }
expect = ["race.lap.leader >= 2"]
timeout = "3m"

[[step]]
id = "desk_fit_racing"
at = "after:lap2"
role = "race_control"
do = "fit"

[[step]]
id = "panel_fit_racing"
at = "after:desk_fit_racing"
role = "director"
do = "fit"

[[step]]
id = "cockpit_timing"
at = "after:panel_fit_racing"
role = "commentator:Comms 2"
do = "view"
args = { area = "timing" }

[[step]]
id = "cockpit_fit_racing"
at = "after:cockpit_timing"
role = "commentator:Comms 2"
do = "fit"
args = { rows = 4 }
expect = ["result('cockpit_fit_racing').rows == 4"]

[[step]]
id = "timing"
at = "after:cockpit_fit_racing"
role = "viewer"
do = "read"
args = { cars = 4 }
expect = ["result('timing').cars == 4", "page('viewer').cars == 4"]
timeout = "20s"
shot = "public-timing"

[[step]]
id = "final_lap"
at = "after:timing"
role = "race_control"
do = "final_lap"
expect = ["race.state == 'finished'"]
timeout = "2m"
shot = "race-control"

[[step]]
id = "chequered"
at = "after:final_lap"
role = "drivers"
do = "stop"
expect = ["page('drivers').sending == 0"]

[[step]]
id = "off_air"
at = "after:chequered"
role = "director"
do = "end_part"
expect = ["not obs.streaming"]

[[step]]
id = "stop_event"
at = "after:off_air"
role = "producer"
do = "stop_event"
expect = ["not relay.up"]
timeout = "30s"
