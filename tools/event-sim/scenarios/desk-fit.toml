# Layout check (#1267, #1304): every live-column control of the Race Control desk, the
# Director Panel and the Commentator Cockpit works in a 1440x900 window without scrolling,
# in the tallest states: driver requests waiting, a red flag with a class lap row, a graphic
# request under a two-row panel header, and qualifying. The cockpit shows all 14 cars of its
# timing while they drive. No state waits on a lap. Each fit waits for the controls its state
# shows; in a 1366x650 laptop window scrolling the column must reach every live control.
description = "Desk, panel and cockpit live columns fit 1440x900 in their tallest states."
max_minutes = 10

[event]
stints = 3
track = "6e378b"
cars = 14
classes = ["GT3", "GT4"]
seed = 7

[[event.commentators]]
name = "Comms 1"
channel = "comms1"
scheduled = true

[[event.commentators]]
name = "Comms 2"
channel = "comms2"
scheduled = true

[[step]]
id = "relay_up"
role = "api"
do = "get"
args = { path = "/status" }
expect = ["relay.up"]

[[step]]
id = "track"
at = "after:relay_up"
role = "producer"
do = "pick_track"

[[step]]
id = "start_event"
at = "after:track"
role = "producer"
do = "start_event"
expect = ["relay.up"]

[[step]]
id = "panel_open"
at = "after:start_event"
role = "director"
do = "open"

[[step]]
id = "register"
at = "after:panel_open"
role = "drivers"
do = "register"
args = { stints = 1 }
expect = ["result('register').registered == 14"]

[[step]]
id = "desk_waiting"
at = "after:register"
role = "race_control"
do = "open"
expect = ["page('race_control').waiting == 14"]
timeout = "15s"

[[step]]
id = "desk_fit_waiting"
at = "after:desk_waiting"
role = "race_control"
do = "fit"
expect = ["result('desk_fit_waiting').controls >= 5"]

[[step]]
id = "approve_drivers"
at = "after:desk_fit_waiting"
role = "race_control"
do = "approve_drivers"
expect = ["page('race_control').waiting == 0"]

[[step]]
id = "drive"
at = "after:approve_drivers"
role = "drivers"
do = "start"
expect = ["race.state == 'racing'", "page('drivers').driving == 14"]
timeout = "60s"

[[step]]
id = "cockpit_timing"
at = "after:drive"
role = "commentator:Comms 1"
do = "open"
expect = ["page('commentator:Comms 1').timing_rows == 14"]
timeout = "30s"

[[step]]
id = "cockpit_fit"
at = "after:cockpit_timing"
role = "commentator:Comms 1"
do = "fit"
args = { rows = 14 }
expect = ["result('cockpit_fit').rows == 14"]
shot = "cockpit-timing"

[[step]]
id = "cockpit_reach_laptop"
at = "after:cockpit_fit"
role = "commentator:Comms 1"
do = "fit"
args = { viewport = [1366, 650], reachable = true }

[[step]]
id = "park"
at = "after:cockpit_reach_laptop"
role = "drivers"
do = "stop"
expect = ["page('drivers').sending == 0"]

[[step]]
id = "red_flag"
at = "after:park"
role = "race_control"
do = "red_flag"
expect = ["race.red_flag"]
timeout = "15s"

[[step]]
id = "desk_fit_red_flag"
at = "after:red_flag"
role = "race_control"
do = "fit"
args = { require = ["Restart released", "Restart after the red flag", "Lap count of GT4"] }
expect = ["result('desk_fit_red_flag').controls >= 8"]
shot = "desk-red-flag"

[[step]]
id = "desk_reach_laptop"
at = "after:desk_fit_red_flag"
role = "race_control"
do = "fit"
args = { viewport = [1366, 650], reachable = true, require = ["Restart released"] }

[[step]]
id = "panel_reach_laptop"
at = "after:desk_reach_laptop"
role = "director"
do = "fit"
args = { viewport = [1366, 650], reachable = true }

[[step]]
id = "long_title"
at = "after:desk_fit_red_flag"
role = "api"
do = "post"
args = { path = "/event/title", json = { title = "GT Endurance Championship 2026 - Round 4 - Nordschleife 24 Hours" } }

[[step]]
id = "take_mode"
at = "after:long_title"
role = "api"
do = "post"
args = { path = "/obs/graphics/mode", json = { role = "commentator", mode = "request" } }

[[step]]
id = "ask_graphic"
at = "after:take_mode"
role = "api"
do = "post"
args = { path = "/console/cockpit/graphic-takes/request", as = "Comms 1", json = { source = "Standings" } }

[[step]]
id = "panel_fit_request"
at = "after:ask_graphic"
role = "director"
do = "fit"
args = { require = ["TAKE", "DECLINE"] }
expect = ["result('panel_fit_request').controls >= 15"]
shot = { name = "panel-request", role = "director" }

[[step]]
id = "qualifying"
at = "after:panel_fit_request"
role = "api"
do = "get"
args = { path = "/mode/qualifying" }
expect = ["race.mode == 'qualifying'"]
timeout = "20s"

[[step]]
id = "desk_qualifying"
at = "after:qualifying"
role = "race_control"
do = "open"
expect = ["'Qualifying' in page('race_control').lap_line"]
timeout = "20s"

[[step]]
id = "desk_fit_qualifying"
at = "after:desk_qualifying"
role = "race_control"
do = "fit"
expect = ["result('desk_fit_qualifying').controls >= 5"]
shot = "desk-qualifying"

[[step]]
id = "panel_fit_qualifying"
at = "after:desk_fit_qualifying"
role = "director"
do = "fit"
expect = ["result('panel_fit_qualifying').controls >= 15"]

[[step]]
id = "stop_event"
at = "after:panel_fit_qualifying"
role = "producer"
do = "stop_event"
expect = ["not relay.up"]
timeout = "30s"
