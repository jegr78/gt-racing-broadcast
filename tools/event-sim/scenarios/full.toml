# Full: qualifying the day before and the race day of the slide deck, in real time, over
# three stints in three lobbies with one commentator each. 14 cars on a Suzuka-length lap
# (about 1:45). The day before: Start event with the Qualifying option; Comms 1 submits
# the qualifying link, the director approves it and feed A runs warm with it (auto-arm).
# The director sets a 10 minute timer, starts the Q Part and puts Comms 1 on air. One driver
# registers for qualifying on the invite page, the others over the API, and Race Control
# approves them all. The director starts the timer as the session starts in the lobby;
# telemetry times the laps, and Race Control adds one by hand for the car whose sender sends
# nothing. Once the timer has run out the cars come in, the result stays in view, and the
# director ends the Q Part, which stops the event. The next day: Start event in race mode.
# One driver registers on the invite page, the others over the API; Race Control corrects
# one request, rejects one and approves the rest with Approve all. The director starts
# Part 1, plays intro and trailer, puts Comms 1 on program, resets the qualifying timer and
# sets the race timer. Race Control presses Race start on the grid and enters every car's
# tyre compound; the timer starts on the first race lap. A formation lap, the start, a pit
# stop with its tyre compound; in stint 1 a car disconnects (suspected, the standings of
# before it, confirmed DC, rejoin mark), another one's sender stops (an estimate 3 s
# behind another car, rejoin mark), a third retires. Comms 2 sends the stint 2 link late.
# Before each stint change the invite page registers one driver of the next stint and
# Race Control approves it; each car boxes in its own second to last lobby lap, the
# splitscreen goes on program once the leader stands in the box, and the director presses
# NEXT; Race Control enters the new stint's compounds and every running team's driver swaps
# in the new lobby; the DC team rejoins a lap down. A red flag in stint 2 ends in a
# keep-gaps restart, then a pit stop with a compound change. In stint 3 Race Control calls
# the final lap when the race timer runs out; after the outro the director ends Part 1,
# the only Part, which stops the event.
# Its 50 screenshots carry deck image names (`<slide>-<n>`): the race-day subset of the
# deck, see tools/CLAUDE.md for the families it does not produce. The captions, chapters, cards and
# focus are the walkthrough film's storyboard (spec 2026-11-24-event-walkthrough-video-design).
# It runs in the workflow (about 36 min there plus the qualifying's 14); it exceeds the
# local 2 GiB E2E unit.
description = "Qualifying the day before, then the deck's race day in real time: approval, three stints, DC, estimate, DNF, red flag, finish."
max_minutes = 75
intro = { title = "GT Racing Broadcast", subtitle = "An endurance event from qualifying to the flag" }
outro = { title = "GT Racing Broadcast", subtitle = "Setup and handbooks: the project wiki on GitHub" }

[event]
stints = 3
track = "6e378b"
track_length_m = 5800
cars = 14
seed = 7
parts = 1
qualifying_part = true

[[event.commentators]]
name = "Comms 1"
channel = "comms1"
scheduled = true

[[event.commentators]]
name = "Comms 2"
channel = "comms2"

[[event.commentators]]
name = "Comms 3"
channel = "comms3"
scheduled = true

[sheet.tabs]
# Empty until Comms 1 submits it in the cockpit and the director approves it.
Qualifying = [["URL", "Streamer", "Stint"], ["", "Comms 1", "Qualifying"]]

[[step]]
id = "relay_up"
role = "api"
do = "get"
args = { path = "/status" }
expect = ["relay.up"]

[[step]]
id = "track"
at = "after:relay_up"
role = "producer"
do = "pick_track"
chapter = "Qualifying (the day before)"
card = { title = "Qualifying", subtitle = "The day before the race" }
caption = "The day before the race: the producer picks the track in the Control Center"

[[step]]
id = "quali_event"
at = "after:track"
role = "producer"
do = "start_event"
args = { qualifying = true }
expect = ["obs.scene == 'Standby'",
          "relay.up",
          "relay.status.mode == 'qualifying'"]
timeout = "30s"
caption = "The producer starts the qualifying event: Start event with the Qualifying option"

[[step]]
id = "submit_first"
at = "after:quali_event"
role = "commentator:Comms 1"
do = "submit_link"
args = { url = "sim://comms1", stint = "Qualifying" }
expect = ["webhook.count('submission') == 1",
          "sheet.qualifying[0].url == ''"]
timeout = "15s"
caption = "Comms 1 submits the qualifying stream link in the cockpit"
focus = ["commentator:Comms 1"]

[[step]]
id = "approve_first"
at = "after:submit_first"
role = "director"
do = "approve_link"
args = { stint = "Qualifying", area = "schedule" }
expect = ["sheet.qualifying[0].url == 'sim://comms1'",
          "webhook.count('stream link approved') == 1"]
timeout = "40s"
caption = "The director approves the link of Comms 1"
focus = ["director", "commentator:Comms 1"]

# The cockpit keeps the area it shows; back to Timing for the cockpit shots.
[[step]]
id = "cockpit1_timing"
at = "after:approve_first"
role = "commentator:Comms 1"
do = "view"
args = { area = "timing" }

[[step]]
id = "warm_a"
at = "after:cockpit1_timing"
role = "director"
do = "view"
args = { area = "handover" }
expect = ["relay.status.feeds.A.state == 'serving'"]
timeout = "90s"
caption = "Feed A runs warm with the qualifying stream as soon as the link is approved"

[[step]]
id = "quali_timer"
at = "after:warm_a"
role = "director"
do = "timer"
args = { duration = "0:10:00" }
expect = ["relay.get('/timer/data').mode == 'prestart'",
          "relay.get('/timer/data').duration_s == 600"]
timeout = "10s"
caption = "The director sets the qualifying timer to 10 minutes before going on air"
focus = ["director", "program"]

[[step]]
id = "quali_live"
at = "after:quali_timer"
role = "director"
do = "start_part"
expect = ["obs.streaming"]
chapter = "On air: qualifying (the day before)"
caption = "The director starts the qualifying broadcast"
focus = ["director", "program"]

[[step]]
id = "quali_on_air"
at = "after:quali_live"
role = "director"
do = "scene"
args = { scene = "Stint" }
expect = ["'comms1' in obs.program_channels"]
timeout = "90s"
caption = "The director puts Comms 1 on program for qualifying"
focus = ["program", "director"]

[[step]]
id = "dashboard"
at = "after:quali_on_air"
role = "director"
do = "show_dashboard"
args = { on = true }
expect = ["race.settings.visible"]
timeout = "10s"
caption = "The director shows the driver dashboard"
focus = ["director", "program"]

[[step]]
id = "overlay"
at = "after:dashboard"
role = "page:overlay"
do = "open"
args = { service = "relay", path = "/drivers", wait_for = "#drivers-tower", viewport = [1920, 1080] }

[[step]]
id = "cockpit1"
at = "after:overlay"
role = "commentator:Comms 1"
do = "open"
expect = ["page('commentator:Comms 1').on_air"]
timeout = "20s"
caption = "Comms 1 is on air: the cockpit shows the qualifying on program"
focus = ["commentator:Comms 1", "program"]

[[step]]
id = "timing_open"
at = "after:cockpit1"
role = "viewer"
do = "open"

[[step]]
id = "chat_mic"
at = "after:timing_open"
role = "commentator:Comms 1"
do = "chat"
args = { text = "Comms 1 here: mic check on the qualifying feed." }
caption = "Comms 1 writes in the crew chat"
focus = ["commentator:Comms 1", "director"]

[[step]]
id = "chat_mic_reply"
at = "after:chat_mic"
role = "director"
do = "chat"
args = { text = "Loud and clear, Comms 1." }
caption = "The director answers in the crew chat"
focus = ["director", "commentator:Comms 1"]

[[step]]
id = "quali_signup"
at = "after:chat_mic_reply"
role = "driver"
do = "register"
args = { entry = "Juniper Motorsport #10", name = "Driver 10-Q", stint = "Qualifying" }
expect = ["page('driver').registered"]
timeout = "20s"
caption = "A driver registers for qualifying on the invite page"
focus = ["driver"]

[[step]]
id = "quali_register"
at = "after:quali_signup"
role = "drivers:quali"
do = "register"
args = { segment = "Qualifying", skip = [{ entry = "Juniper Motorsport #10" }] }
expect = ["result('quali_register').registered == 13"]
caption = "The other drivers register for qualifying"
focus = ["driver"]

[[step]]
id = "quali_waiting"
at = "after:quali_register"
role = "race_control"
do = "open"
expect = ["page('race_control').waiting == 14"]
timeout = "20s"

[[step]]
id = "quali_approve"
at = "after:quali_waiting"
role = "race_control"
do = "approve_all"
expect = ["result('quali_approve').approved == 14",
          "page('race_control').waiting == 0"]
timeout = "20s"
caption = "Race Control approves the 14 qualifying requests with Approve all"
focus = ["race_control", "driver"]

[[step]]
id = "quali_drive"
at = "after:quali_approve"
role = "drivers:quali"
do = "start"
expect = ["page('drivers:quali').driving == 14"]
timeout = "60s"
caption = "The session starts in the lobby: the cars go out for their qualifying laps"
focus = ["program", "viewer"]

[[step]]
id = "quali_clock"
at = "after:quali_drive"
role = "director"
do = "timer_key"
args = { key = "START" }
expect = ["relay.get('/timer/data').mode == 'running'"]
timeout = "10s"
caption = "The director starts the qualifying timer by hand"
focus = ["director", "program"]

[[step]]
id = "quali_silent"
at = "after:quali_clock"
role = "drivers:quali"
do = "drop"
args = { entry = "Northwind Racing #18" }
caption = "Telemetry times every car; the sender of Northwind Racing #18 sends nothing"
focus = ["race_control", "viewer"]

[[step]]
id = "quali_lap1"
at = "after:quali_silent"
role = "race_control"
do = "add_lap"
args = { entry = "Northwind Racing #18", time = "1:44.870" }
caption = "Race Control adds the lap of Northwind Racing #18 by hand, the exception"
focus = ["race_control", "viewer"]

[[step]]
id = "quali_desk"
at = "after:quali_lap1"
role = "race_control"
do = "view"
args = { area = "qualifying" }
shot = { name = "quali-desk-1", role = "race_control", element = ".area[data-area=\"qualifying\"]" }

[[step]]
id = "quali_timing"
at = "after:quali_desk"
role = "viewer"
do = "read"
args = { cars = 1 }
expect = ["len(having(page('viewer').rows, 'Northwind', '1:44.870')) == 1"]
timeout = "20s"
shot = "quali-public-1"
caption = "The public timing ranks the qualifying laps"
focus = ["viewer", "race_control"]

[[step]]
id = "quali_laps_in"
at = "after:quali_timing"
role = "api"
do = "get"
args = { path = "/drivers/race" }
expect = ["race.qualifying[13].best_ms > 0"]
timeout = "10m"

[[step]]
id = "quali_watch"
at = "after:quali_laps_in"
role = "race_control"
do = "hold"
args = { seconds = 20 }
caption = "Race Control follows the qualifying laps at its desk"
focus = ["race_control", "viewer"]

[[step]]
id = "shot_quali_cockpit_1"
at = "after:quali_watch+3s"
role = "api"
do = "get"
args = { path = "/status" }
expect = ["relay.up"]
shot = { name = "quali-cockpit-1", role = "commentator:Comms 1", element = "#timingCard" }

[[step]]
id = "shot_quali_tower_gap_1"
at = "after:shot_quali_cockpit_1+3s"
role = "api"
do = "get"
args = { path = "/status" }
expect = ["relay.up"]
shot = { name = "quali-tower-gap-1", role = "page:overlay", element = "#drivers-tower" }

[[step]]
id = "quali_field"
at = "after:shot_quali_tower_gap_1"
role = "viewer"
do = "read"
args = { cars = 14 }
expect = ["page('viewer').cars >= 14"]
timeout = "20s"
caption = "The public timing ranks every car by its best qualifying lap"
focus = ["viewer", "program"]

[[step]]
id = "quali_over"
at = "after:quali_field"
role = "api"
do = "get"
args = { path = "/status" }
expect = ["relay.status.timer.remaining_s == 0"]
timeout = "11m"

[[step]]
id = "quali_in"
at = "after:quali_over"
role = "drivers:quali"
do = "stop"
caption = "The qualifying timer has run out: the cars come in"
focus = ["program", "viewer"]

[[step]]
id = "quali_result"
at = "after:quali_in"
role = "viewer"
do = "hold"
args = { seconds = 8 }
caption = "The qualifying result on the public timing"
focus = ["viewer", "program"]

[[step]]
id = "quali_stop"
at = "after:quali_result"
role = "director"
do = "end_part"
expect = ["not obs.streaming", "not relay.up"]
timeout = "60s"
caption = "The director ends the qualifying broadcast, and the event stops with it"
focus = ["director", "program"]

# The relay's own `event stop` releases the OBS feeds in the seconds after the relay died.
[[step]]
id = "start_event"
at = "after:quali_stop+5s"
role = "producer"
do = "start_event"
args = { qualifying = false }
expect = ["obs.scene == 'Standby'",
          "relay.up",
          "relay.status.mode == 'race'"]
timeout = "30s"
chapter = "Race day: start the event"
card = { title = "Race day", subtitle = "Three stints, two driver swaps" }
caption = "The next day the producer starts the race event, without the Qualifying option"

[[step]]
id = "race_settings"
at = "after:start_event"
role = "producer"
do = "race_settings"
args = { formation = true, finish_mode = "laps" }
expect = ["race.settings.formation",
          "race.settings.finish_mode == 'laps'"]
caption = "The producer sets the race: a formation lap and a finish by laps"

# The qualifying event's stop ended its invite: the driver page opens the race event's.
[[step]]
id = "producer_away"
at = "after:race_settings"
role = "producer"
do = "close"

[[step]]
id = "driver_open"
at = "after:producer_away"
role = "driver"
do = "open"

[[step]]
id = "driver_signup"
at = "after:driver_open"
role = "driver"
do = "register"
args = { entry = "Juniper Motorsport #10", name = "Driver 10-1", stint = 1 }
expect = ["page('driver').registered"]
timeout = "20s"
chapter = "Drivers sign up"
caption = "A driver registers for stint 1 on the invite page"

[[step]]
id = "driver_wrong_team"
at = "after:driver_signup"
role = "driver"
do = "register"
args = { entry = "Cedar Motorsport #33", name = "Reserve 44", stint = 1 }
expect = ["page('driver').registered"]
timeout = "20s"
caption = "Reserve 44 registers under the wrong team"

[[step]]
id = "driver_guest"
at = "after:driver_wrong_team"
role = "driver"
do = "register"
args = { entry = "Echo Racing #55", name = "Guest Driver", stint = 1 }
expect = ["page('driver').registered"]
timeout = "20s"
caption = "Guest Driver registers for Echo Racing #55"

[[step]]
id = "register"
at = "after:driver_guest"
role = "drivers"
do = "register"
args = { stints = 3, now = [1], skip = [{ entry = "Juniper Motorsport #10", stint = 1 }, { entry = "Kestrel Sim Racing #12", stint = 2 }] }
expect = ["result('register').registered == 13"]
caption = "The other stint 1 drivers register"
focus = ["driver"]

[[step]]
id = "desk_waiting"
at = "after:register"
role = "race_control"
do = "open"
expect = ["page('race_control').waiting == 16"]
timeout = "20s"

[[step]]
id = "correct_reserve"
at = "after:desk_waiting"
role = "race_control"
do = "correct_driver"
args = { name = "Reserve 44", entry = "Delta Sim Team #44" }
timeout = "20s"
caption = "Race Control corrects the team of Reserve 44 to Delta Sim Team #44 and approves it"
focus = ["race_control", "driver"]

[[step]]
id = "driver_away"
at = "after:correct_reserve"
role = "driver"
do = "close"

[[step]]
id = "reject_guest"
at = "after:driver_away"
role = "race_control"
do = "reject_driver"
args = { name = "Guest Driver" }
expect = ["page('race_control').waiting == 14"]
timeout = "20s"
caption = "Race Control rejects the request of Guest Driver"

[[step]]
id = "desk_requests"
at = "after:reject_guest"
role = "race_control"
do = "view"
args = { area = "drivers" }
shot = { name = "approval-requests-1", role = "race_control", element = ".area[data-area=\"drivers\"]" }

[[step]]
id = "approve_drivers"
at = "after:desk_requests+6s"
role = "race_control"
do = "approve_all"
expect = ["result('approve_drivers').approved == 14",
          "result('approve_drivers').skipped == 0",
          "page('race_control').waiting == 0"]
timeout = "20s"
shot = { name = "approval-approved-1", role = "race_control", element = ".area[data-area=\"drivers\"]" }
caption = "Race Control approves the 14 waiting requests with Approve all"

[[step]]
id = "go_live"
at = "after:approve_drivers"
role = "director"
do = "start_part"
expect = ["obs.streaming"]
chapter = "Race start"
caption = "The director starts the race broadcast"
focus = ["director", "program"]

[[step]]
id = "intro"
at = "after:go_live"
role = "director"
do = "play"
args = { media = "intro" }
caption = "The director plays the intro"
focus = ["program", "director"]

[[step]]
id = "trailer"
at = "after:intro"
role = "director"
do = "play"
args = { media = "trailer" }
caption = "The director plays the trailer"
focus = ["program", "director"]

[[step]]
id = "stint1_on_air"
at = "after:trailer"
role = "director"
do = "scene"
args = { scene = "Stint" }
expect = ["'comms1' in obs.program_channels"]
timeout = "90s"
caption = "The director puts Comms 1 on program for stint 1"
focus = ["program", "director"]

[[step]]
id = "overlay_race"
at = "after:stint1_on_air"
role = "page:overlay"
do = "open"
args = { service = "relay", path = "/drivers", wait_for = "#drivers-tower", viewport = [1920, 1080] }

[[step]]
id = "cockpit2"
at = "after:overlay_race"
role = "commentator:Comms 2"
do = "open"
expect = ["not page('commentator:Comms 2').on_air"]
timeout = "20s"

[[step]]
id = "cockpit2_away"
at = "after:cockpit2"
role = "commentator:Comms 2"
do = "close"

[[step]]
id = "cockpit3"
at = "after:cockpit2_away"
role = "commentator:Comms 3"
do = "open"
expect = ["not page('commentator:Comms 3').on_air"]
timeout = "20s"

# The race event has a new timing link.
[[step]]
id = "cockpit3_away"
at = "after:cockpit3"
role = "commentator:Comms 3"
do = "close"

[[step]]
id = "timing_race"
at = "after:cockpit3_away"
role = "viewer"
do = "open"

# The qualifying timer stands finished: Race start starts only a timer that never started.
[[step]]
id = "timer_reset"
at = "after:timing_race"
role = "director"
do = "timer_key"
args = { key = "RESET" }
expect = ["relay.get('/timer/data').mode == 'prestart'"]
timeout = "10s"
caption = "The director resets the timer that ran in qualifying"
focus = ["director", "program"]

# The race's length up to stint 3's fifth lobby lap, with the two swaps and the red flag, so the timer runs out just before Race Control calls the final lap.
[[step]]
id = "timer_set"
at = "after:timer_reset"
role = "director"
do = "timer"
args = { duration = "0:33:00" }
expect = ["relay.get('/timer/data').mode == 'prestart'",
          "relay.get('/timer/data').duration_s == 1980"]
timeout = "10s"
caption = "The director sets the race timer to the race length"
focus = ["director", "program"]

[[step]]
id = "race_start"
at = "after:timer_set+3s"
role = "race_control"
do = "race_start"
expect = ["race.start_armed"]
timeout = "15s"
caption = "Race Control presses Race start with the cars on the grid"
focus = ["race_control", "program"]

[[step]]
id = "compounds1"
at = "after:race_start"
role = "race_control"
do = "compounds"
args = { code = "RH" }
expect = ["race.compounds['Apex Works #11'].code == 'RH'"]
soft = ["len(result('compounds1').changed) == 14"]
timeout = "15s"
caption = "Race Control enters every car's starting tyre compound"

[[step]]
id = "desk_grid"
at = "after:compounds1"
role = "race_control"
do = "view"
args = { area = "race" }

[[step]]
id = "stint_laps"
at = "after:desk_grid"
role = "race_control"
do = "stint_laps"
args = { laps = { "Stint 1" = 7, "Stint 2" = 12, "Stint 3" = 5 } }
expect = ["row(race.stints, 'stint', 'Stint 2').laps == 12"]
soft = ["row(sheet.tab('Schedule'), 'Stint', 'Stint 2').laps == '12'"]
timeout = "30s"
caption = "Race Control sets each stint lobby's lap count"
focus = ["race_control"]

[[step]]
id = "formation"
at = "after:stint_laps"
role = "drivers"
do = "start"
expect = ["page('drivers').driving == 14"]
timeout = "60s"
caption = "The cars leave the grid for the formation lap"
focus = ["program", "viewer"]

[[step]]
id = "rc_formation"
at = "after:formation"
role = "race_control"
do = "formation_lap"
expect = ["relay.get('/setup/data').fields.racecontrol == 'Formation Lap'"]
timeout = "20s"
caption = "Race Control shows Formation Lap on the HUD with one click"
focus = ["race_control", "program"]

[[step]]
id = "shot_formation_1"
at = "after:formation+3s"
role = "api"
do = "get"
args = { path = "/drivers/race" }
expect = ["race.state == 'waiting'", "race.settings.formation"]
shot = { name = "formation-1", role = "page:overlay" }

[[step]]
id = "shot_formation_2"
at = "after:rc_formation+3s"
role = "api"
do = "get"
args = { path = "/status" }
expect = ["relay.up"]
shot = { name = "formation-2", role = "viewer" }

[[step]]
id = "racing"
at = "after:shot_formation_2"
role = "api"
do = "get"
args = { path = "/drivers/race" }
expect = ["race.state == 'racing'",
          "relay.get('/timer/data').mode == 'running'"]
timeout = "6m"

[[step]]
id = "rc_go"
at = "after:racing"
role = "api"
do = "get"
args = { path = "/drivers/race" }
expect = ["relay.get('/setup/data').fields.racecontrol == ''"]
timeout = "20s"
caption = "Formation Lap leaves the HUD by itself as the race starts"
focus = ["program", "race_control"]

[[step]]
id = "shot_start_1"
at = "after:rc_go+3s"
role = "api"
do = "get"
args = { path = "/status" }
expect = ["relay.up"]
shot = { name = "start-1", role = "race_control", element = ".area[data-area=\"race\"] .tbl" }
caption = "The race starts"
focus = ["program", "viewer"]

[[step]]
id = "desk_race"
at = "after:shot_start_1"
role = "race_control"
do = "view"
args = { area = "race" }

[[step]]
id = "shot_start_2"
at = "after:desk_race+3s"
role = "api"
do = "get"
args = { path = "/status" }
expect = ["relay.up"]
shot = { name = "start-2", role = "page:overlay" }

[[step]]
id = "shot_new_cockpit_timing_1"
at = "after:shot_start_2+3s"
role = "api"
do = "get"
args = { path = "/status" }
expect = ["relay.up"]
