role = "api"
do = "get"
args = { path = "/drivers/race" }
expect = ["race.lap.leader >= 15"]
timeout = "12m"

[[step]]
id = "final_lap"
at = "after:lap15"
role = "race_control"
do = "final_lap"
expect = ["race.state in ['final_lap', 'finishing', 'finished']"]
timeout = "30s"
chapter = "The finish"
caption = "Race Control calls the final lap"
focus = ["race_control", "viewer"]

[[step]]
id = "shot_finallap_2"
at = "after:final_lap+3s"
role = "api"
do = "get"
args = { path = "/status" }
expect = ["relay.up"]
shot = { name = "finallap-2", role = "page:overlay" }

[[step]]
id = "desk_final"
at = "after:shot_finallap_2"
role = "race_control"
do = "view"
args = { area = "race" }
shot = { name = "finallap-1", role = "race_control", element = ".area[data-area=\"race\"] .tbl" }

[[step]]
id = "flag"
at = "after:desk_final"
role = "api"
do = "get"
args = { path = "/drivers/race" }
expect = ["race.state == 'finishing' or race.state == 'finished'"]
timeout = "5m"

[[step]]
id = "shot_chequered_1"
at = "after:flag+3s"
role = "api"
do = "get"
args = { path = "/status" }
expect = ["relay.up"]
shot = { name = "chequered-1", role = "page:overlay" }

[[step]]
id = "shot_chequered_2"
at = "after:shot_chequered_1+3s"
role = "api"
do = "get"
args = { path = "/status" }
expect = ["relay.up"]
shot = { name = "chequered-2", role = "viewer" }

[[step]]
id = "finished"
at = "after:shot_chequered_2"
role = "api"
do = "get"
args = { path = "/drivers/race" }
expect = ["race.state == 'finished'",
          "row(race.entries, 'entry', 'Ion Racing #9').status == 'retired'"]
timeout = "5m"

[[step]]
id = "shot_finished_1"
at = "after:finished+3s"
role = "api"
do = "get"
args = { path = "/status" }
expect = ["relay.up"]
shot = { name = "finished-1", role = "page:overlay" }

[[step]]
id = "shot_finished_2"
at = "after:shot_finished_1+3s"
role = "api"
do = "get"
args = { path = "/status" }
expect = ["relay.up"]
shot = { name = "finished-2", role = "viewer" }

[[step]]
id = "fastest_public"
at = "after:shot_finished_2"
role = "viewer"
do = "read"
expect = ["'Fastest lap' in page('viewer').fastest"]
timeout = "20s"
caption = "The public timing shows the result and the fastest lap"
focus = ["viewer", "program"]

[[step]]
id = "shot_new_cockpit_finished"
at = "after:fastest_public+3s"
role = "api"
do = "get"
args = { path = "/status" }
expect = ["relay.up"]
shot = { name = "new-cockpit-finished", role = "commentator:Comms 3", element = "#timingCard" }

[[step]]
id = "chat_finish"
at = "after:shot_new_cockpit_finished"
role = "commentator:Comms 3"
do = "chat"
args = { text = "Thanks everyone, that was a great race." }
caption = "Comms 3 thanks the crew in the crew chat"
focus = ["commentator:Comms 3", "director"]

[[step]]
id = "chequered"
at = "after:chat_finish"
role = "drivers"
do = "stop"
caption = "The drivers stop after the chequered flag"
focus = ["program", "viewer"]

[[step]]
id = "outro"
at = "after:chequered"
role = "director"
do = "play"
args = { media = "outro" }
chapter = "Off air"
caption = "The director plays the outro"
focus = ["program", "director"]

[[step]]
id = "off_air"
at = "after:outro"
role = "director"
do = "end_part"
expect = ["not obs.streaming"]
caption = "The director ends Part 1 of the broadcast"
focus = ["director", "program"]

[[step]]
id = "stop_event"
at = "after:off_air"
role = "producer"
do = "stop_event"
expect = ["not relay.up"]
timeout = "30s"
caption = "The producer stops the event"
