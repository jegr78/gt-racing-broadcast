# Full: the race day of the slide deck, in real time, over three stints in three
# lobbies with one commentator each. 14 cars on a Suzuka-length lap (about 1:45).
# Start event, then qualifying mode: Comms 1 submits the qualifying link, the director
# approves it and feed A runs warm with it (auto-arm). One driver registers on the invite
# page, the others over the API; Race Control corrects one request, rejects one and
# approves the rest with Approve all. Intro and trailer, a few crew chat messages,
# then the desk adds qualifying laps, the director switches to race mode, sets the race
# timer to the race length and goes live. Race Control presses Race start on the grid and
# enters every car's tyre compound; the timer starts on the first race lap. A formation
# lap, the start, a pit stop with its tyre compound; in stint 1 a car disconnects
# (suspected, the standings of before it, confirmed DC, rejoin mark), another one's sender
# stops (an estimate 3 s behind another car, rejoin mark), a third retires. Comms 2 sends
# the stint 2 link late. Before each stint change the invite page registers one driver of
# the next stint and Race Control approves it; once the incoming feed serves, the
# splitscreen is on program while the cars box and holds both feeds, the director presses
# NEXT and cuts back to the stint, and every running team's driver swaps in the new lobby;
# Race Control enters the new stint's compounds; the DC team rejoins a lap down. A red flag
# in stint 2 ends in a keep-gaps restart, then a pit stop with a compound change. In stint
# 3 Race Control calls the final lap; the outro ends the broadcast.
# Its 50 screenshots carry deck image names (`<slide>-<n>`): the race-day subset of the
# deck, see tools/CLAUDE.md for the families it does not produce. The captions, chapters and
# focus are the walkthrough film's storyboard (spec 2026-11-24-event-walkthrough-video-design).
# It runs in the workflow (about 36 min there); it exceeds the local 2 GiB E2E unit.
description = "The deck's race day in real time: qualifying, approval, three stints, DC, estimate, DNF, red flag, finish."
max_minutes = 75

[event]
stints = 3
track = "6e378b"
track_length_m = 5800
cars = 14
seed = 7
parts = 2

[[event.commentators]]
name = "Comms 1"
channel = "comms1"
scheduled = true

[[event.commentators]]
name = "Comms 2"
channel = "comms2"

[[event.commentators]]
name = "Comms 3"
channel = "comms3"
scheduled = true

[sheet.tabs]
# Empty until Comms 1 submits it in the cockpit and the director approves it.
Qualifying = [["URL", "Streamer", "Stint"], ["", "Comms 1", "Qualifying"]]

[[step]]
id = "relay_up"
role = "api"
do = "get"
args = { path = "/status" }
expect = ["relay.up"]

[[step]]
id = "track"
at = "after:relay_up"
role = "producer"
do = "pick_track"
chapter = "Start the event"
caption = "The producer picks the track in the Control Center"

[[step]]
id = "race_settings"
at = "after:track"
role = "producer"
do = "race_settings"
args = { formation = true, finish_mode = "time" }
expect = ["race.settings.formation",
          "race.settings.finish_mode == 'time'"]
caption = "The producer sets the race: a formation lap and a timed finish"

[[step]]
id = "start_event"
at = "after:race_settings"
role = "producer"
do = "start_event"
expect = ["obs.scene == 'Standby'",
          "relay.up"]
caption = "The producer starts the event"

[[step]]
id = "quali_mode"
at = "after:start_event"
role = "director"
do = "mode"
args = { mode = "qualifying" }
expect = ["relay.status.mode == 'qualifying'"]
timeout = "20s"
chapter = "First link"
caption = "The director switches the relay to qualifying"

[[step]]
id = "submit_first"
at = "after:quali_mode"
role = "commentator:Comms 1"
do = "submit_link"
args = { url = "sim://comms1", stint = "Qualifying" }
expect = ["webhook.count('submission') == 1",
          "sheet.qualifying[0].url == ''"]
timeout = "15s"
caption = "Comms 1 submits the qualifying stream link in the cockpit"
focus = ["commentator:Comms 1", "director"]

[[step]]
id = "approve_first"
at = "after:submit_first"
role = "director"
do = "approve_link"
args = { stint = "Qualifying", area = "schedule" }
expect = ["sheet.qualifying[0].url == 'sim://comms1'",
          "webhook.count('stream link approved') == 1"]
timeout = "40s"
caption = "The director approves the link of Comms 1"
focus = ["director", "commentator:Comms 1"]

# The cockpit keeps the area it shows; back to Timing for the cockpit shots.
[[step]]
id = "cockpit1_timing"
at = "after:approve_first"
role = "commentator:Comms 1"
do = "view"
args = { area = "timing" }

[[step]]
id = "warm_a"
at = "after:cockpit1_timing"
role = "director"
do = "view"
args = { area = "handover" }
expect = ["relay.status.feeds.A.state == 'serving'"]
timeout = "90s"
caption = "Feed A runs warm with the qualifying stream as soon as the link is approved"

[[step]]
id = "driver_signup"
at = "after:warm_a"
role = "driver"
do = "register"
args = { entry = "Juniper Motorsport #10", name = "Driver 10-1", stint = 1 }
expect = ["page('driver').registered"]
timeout = "20s"
chapter = "Drivers sign up"
caption = "A driver registers for stint 1 on the invite page"

[[step]]
id = "driver_wrong_team"
at = "after:driver_signup"
role = "driver"
do = "register"
args = { entry = "Cedar Motorsport #33", name = "Reserve 44", stint = 1 }
expect = ["page('driver').registered"]
timeout = "20s"
caption = "Reserve 44 registers under the wrong team"

[[step]]
id = "driver_guest"
at = "after:driver_wrong_team"
role = "driver"
do = "register"
args = { entry = "Echo Racing #55", name = "Guest Driver", stint = 1 }
expect = ["page('driver').registered"]
timeout = "20s"
caption = "Guest Driver registers for Echo Racing #55"

[[step]]
id = "register"
at = "after:driver_guest"
role = "drivers"
do = "register"
args = { stints = 3, skip = [{ entry = "Juniper Motorsport #10", stint = 1 }, { entry = "Kestrel Sim Racing #12", stint = 2 }, { entry = "Lakeside Racing #14", stint = 3 }] }
expect = ["result('register').registered == 39"]
caption = "The other drivers register for their stints"
focus = ["driver"]

[[step]]
id = "desk_waiting"
at = "after:register"
role = "race_control"
do = "open"
expect = ["page('race_control').waiting == 42"]
timeout = "20s"

[[step]]
id = "correct_reserve"
at = "after:desk_waiting"
role = "race_control"
do = "correct_driver"
args = { name = "Reserve 44", entry = "Delta Sim Team #44" }
timeout = "20s"
caption = "Race Control corrects the team of Reserve 44 to Delta Sim Team #44 and approves it"
focus = ["race_control", "driver"]

[[step]]
id = "reject_guest"
at = "after:correct_reserve"
role = "race_control"
do = "reject_driver"
args = { name = "Guest Driver" }
expect = ["page('race_control').waiting == 40"]
timeout = "20s"
caption = "Race Control rejects the request of Guest Driver"

[[step]]
id = "desk_requests"
at = "after:reject_guest"
role = "race_control"
do = "view"
args = { area = "drivers" }
shot = { name = "approval-requests-1", role = "race_control", element = ".area[data-area=\"drivers\"]" }

[[step]]
id = "approve_drivers"
at = "after:desk_requests"
role = "race_control"
do = "approve_all"
expect = ["result('approve_drivers').approved == 40",
          "result('approve_drivers').skipped == 0",
          "page('race_control').waiting == 0"]
timeout = "20s"
shot = { name = "approval-approved-1", role = "race_control", element = ".area[data-area=\"drivers\"]" }
caption = "Race Control approves the 40 waiting requests with Approve all"

[[step]]
id = "intro"
at = "after:approve_drivers"
role = "director"
do = "play"
args = { media = "intro" }
chapter = "On air: qualifying"
caption = "The director plays the intro"
focus = ["program", "director"]

[[step]]
id = "trailer"
at = "after:intro"
role = "director"
do = "play"
args = { media = "trailer" }
caption = "The director plays the trailer"
focus = ["program", "director"]

[[step]]
id = "quali_on_air"
at = "after:trailer"
role = "director"
do = "scene"
args = { scene = "Stint" }
expect = ["'comms1' in obs.program_channels"]
timeout = "90s"
caption = "The director puts Comms 1 on program for qualifying"
focus = ["program", "director"]

[[step]]
id = "dashboard"
at = "after:quali_on_air"
role = "director"
do = "show_dashboard"
args = { on = true }
expect = ["race.settings.visible"]
timeout = "10s"
caption = "The director shows the driver dashboard"
focus = ["director", "program"]

[[step]]
id = "overlay"
at = "after:dashboard"
role = "page:overlay"
do = "open"
args = { service = "relay", path = "/drivers", wait_for = "#drivers-tower", viewport = [1920, 1080] }

[[step]]
id = "cockpit1"
at = "after:overlay"
role = "commentator:Comms 1"
do = "open"
expect = ["page('commentator:Comms 1').on_air"]
timeout = "20s"

[[step]]
id = "cockpit2"
at = "after:cockpit1"
role = "commentator:Comms 2"
do = "open"
expect = ["not page('commentator:Comms 2').on_air"]
timeout = "20s"

[[step]]
id = "cockpit3"
at = "after:cockpit2"
role = "commentator:Comms 3"
do = "open"
expect = ["not page('commentator:Comms 3').on_air"]
timeout = "20s"

[[step]]
id = "timing_open"
at = "after:cockpit3"
role = "viewer"
do = "open"

[[step]]
id = "chat_mic"
at = "after:timing_open"
role = "commentator:Comms 1"
do = "chat"
args = { text = "Comms 1 here: mic check on the qualifying feed." }
caption = "Comms 1 writes in the crew chat"
focus = ["commentator:Comms 1", "director"]

[[step]]
id = "chat_mic_reply"
at = "after:chat_mic"
role = "director"
do = "chat"
args = { text = "Loud and clear, Comms 1." }
caption = "The director answers in the crew chat"
focus = ["director", "commentator:Comms 1"]

[[step]]
id = "quali_lap1"
at = "after:chat_mic_reply"
role = "race_control"
do = "add_lap"
args = { entry = "Blue Harbor Racing #22", time = "1:45.312" }
caption = "Race Control adds a qualifying lap of Blue Harbor Racing #22"
focus = ["race_control", "viewer"]

[[step]]
id = "quali_lap2"
at = "after:quali_lap1"
role = "race_control"
do = "add_lap"
args = { entry = "Apex Works #11", time = "1:44.208" }
caption = "Race Control adds a qualifying lap of Apex Works #11"
focus = ["race_control", "viewer"]

[[step]]
id = "quali_lap3"
at = "after:quali_lap2"
role = "race_control"
do = "add_lap"
args = { entry = "Cedar Motorsport #33", time = "1:44.951" }
caption = "Race Control adds a qualifying lap of Cedar Motorsport #33"
focus = ["race_control", "viewer"]

[[step]]
id = "quali_desk"
at = "after:quali_lap3"
role = "race_control"
do = "view"
args = { area = "qualifying" }
shot = { name = "quali-desk-1", role = "race_control", element = ".area[data-area=\"qualifying\"]" }

[[step]]
id = "quali_timing"
at = "after:quali_desk"
role = "viewer"
do = "read"
args = { cars = 3 }
expect = ["'Apex Works' in page('viewer').rows[0]",
          "'Cedar Motorsport' in page('viewer').rows[1]",
          "'Blue Harbor' in page('viewer').rows[2]"]
timeout = "20s"
shot = "quali-public-1"
caption = "The public timing ranks the qualifying laps"
focus = ["viewer", "race_control"]

[[step]]
id = "shot_quali_cockpit_1"
at = "after:quali_timing+3s"
role = "api"
do = "get"
args = { path = "/status" }
expect = ["relay.up"]
shot = { name = "quali-cockpit-1", role = "commentator:Comms 1", element = "#timingCard" }

[[step]]
id = "shot_quali_tower_gap_1"
at = "after:shot_quali_cockpit_1+3s"
role = "api"
do = "get"
args = { path = "/status" }
expect = ["relay.up"]
shot = { name = "quali-tower-gap-1", role = "page:overlay", element = "#drivers-tower" }

[[step]]
id = "race_mode"
at = "after:shot_quali_tower_gap_1"
role = "director"
do = "mode"
args = { mode = "race" }
expect = ["relay.status.mode == 'race'",
          "'comms1' in obs.program_channels"]
timeout = "90s"
chapter = "Race start"
caption = "The director switches the relay to race mode"
focus = ["director", "program"]

# The race's length: 16 laps of about 1:45 plus the two swaps and the red flag.
[[step]]
id = "timer_set"
at = "after:race_mode"
role = "director"
do = "timer"
args = { duration = "0:38:00" }
expect = ["relay.get('/timer/data').mode == 'prestart'",
          "relay.get('/timer/data').duration_s == 2280"]
timeout = "10s"
caption = "The director sets the race timer to the race length"
focus = ["director", "program"]

[[step]]
id = "go_live"
at = "after:timer_set+3s"
role = "director"
do = "start_part"
expect = ["obs.streaming"]
caption = "The director starts Part 1 of the broadcast"
focus = ["director", "program"]

[[step]]
id = "race_start"
at = "after:go_live"
role = "race_control"
do = "race_start"
expect = ["race.start_armed"]
timeout = "15s"
caption = "Race Control presses Race start with the cars on the grid"
focus = ["race_control", "program"]

[[step]]
id = "compounds1"
at = "after:race_start"
role = "race_control"
do = "compounds"
args = { code = "RH" }
expect = ["race.compounds['Apex Works #11'].code == 'RH'"]
soft = ["len(result('compounds1').changed) == 14"]
timeout = "15s"
caption = "Race Control enters every car's starting tyre compound"

[[step]]
id = "desk_grid"
at = "after:compounds1"
role = "race_control"
do = "view"
args = { area = "race" }

[[step]]
id = "formation"
at = "after:desk_grid"
role = "drivers"
do = "start"
expect = ["page('drivers').driving == 14"]
timeout = "60s"
caption = "The cars leave the grid for the formation lap"
focus = ["program", "viewer"]

[[step]]
id = "shot_formation_1"
at = "after:formation+3s"
role = "api"
do = "get"
args = { path = "/drivers/race" }
expect = ["race.state == 'waiting'", "race.settings.formation"]
shot = { name = "formation-1", role = "page:overlay" }

[[step]]
id = "shot_formation_2"
at = "after:shot_formation_1+3s"
role = "api"
do = "get"
args = { path = "/status" }
expect = ["relay.up"]
shot = { name = "formation-2", role = "viewer" }

[[step]]
id = "racing"
at = "after:shot_formation_2"
role = "api"
do = "get"
args = { path = "/drivers/race" }
expect = ["race.state == 'racing'",
          "relay.get('/timer/data').mode == 'running'"]
timeout = "6m"

[[step]]
id = "shot_start_1"
at = "after:racing+3s"
role = "api"
do = "get"
args = { path = "/status" }
expect = ["relay.up"]
shot = { name = "start-1", role = "race_control", element = ".area[data-area=\"race\"] .tbl" }
caption = "The race starts"
focus = ["program", "viewer"]

[[step]]
id = "desk_race"
at = "after:shot_start_1"
role = "race_control"
do = "view"
args = { area = "race" }

[[step]]
id = "shot_start_2"
at = "after:desk_race+3s"
role = "api"
do = "get"
args = { path = "/status" }
expect = ["relay.up"]
shot = { name = "start-2", role = "page:overlay" }

[[step]]
id = "shot_new_cockpit_timing_1"
at = "after:shot_start_2+3s"
role = "api"
do = "get"
args = { path = "/status" }
expect = ["relay.up"]
shot = { name = "new-cockpit-timing-1", role = "commentator:Comms 1", element = "#timingCard" }

[[step]]
id = "lap2"
at = "after:shot_new_cockpit_timing_1"
role = "api"
do = "get"
args = { path = "/drivers/race" }
expect = ["race.lap.leader >= 2"]
timeout = "12m"

[[step]]
id = "pit"
at = "after:lap2"
role = "drivers"
do = "pit"
args = { entry = "Blue Harbor Racing #22", seconds = 20 }
chapter = "Stint 1 at the desk"
caption = "Blue Harbor Racing #22 comes in for a pit stop"
focus = ["race_control", "viewer"]

[[step]]
id = "in_pits"
at = "after:pit"
role = "api"
do = "get"
args = { path = "/drivers/race" }
expect = ["row(race.entries, 'entry', 'Blue Harbor Racing #22').status == 'box'"]
timeout = "5m"

[[step]]
id = "shot_pits_1"
at = "after:in_pits+3s"
role = "api"
do = "get"
args = { path = "/status" }
expect = ["relay.up"]
shot = { name = "pits-1", role = "race_control", element = ".area[data-area=\"race\"] .tbl" }

[[step]]
id = "shot_pits_2"
at = "after:shot_pits_1+3s"
role = "api"
do = "get"
args = { path = "/status" }
expect = ["relay.up"]
shot = { name = "pits-2", role = "page:overlay" }

[[step]]
id = "out_of_pits"
at = "after:shot_pits_2"
role = "api"
do = "get"
args = { path = "/drivers/race" }
expect = ["row(race.entries, 'entry', 'Blue Harbor Racing #22').status == 'racing'",
          "row(race.entries, 'entry', 'Blue Harbor Racing #22').pit_stops == 1"]
timeout = "2m"

[[step]]
id = "shot_tower_full_1"
at = "after:out_of_pits+3s"
role = "api"
do = "get"
args = { path = "/status" }
expect = ["relay.up"]
shot = { name = "tower-full-1", role = "page:overlay", element = "#drivers-tower" }

[[step]]
id = "compound"
at = "after:shot_tower_full_1"
role = "race_control"
do = "compound"
args = { entry = "Blue Harbor Racing #22", code = "RM" }
expect = ["race.compounds['Blue Harbor Racing #22'].code == 'RM'"]
timeout = "15s"
caption = "Race Control confirms the tyre compound of Blue Harbor Racing #22"

[[step]]
id = "desk_race_back"
at = "after:compound"
role = "race_control"
do = "view"
args = { area = "race" }

[[step]]
id = "lap3"
at = "after:desk_race_back"
role = "api"
do = "get"
args = { path = "/drivers/race" }
expect = ["race.lap.leader >= 3"]
timeout = "12m"

[[step]]
id = "dc_drop"
at = "after:lap3"
role = "drivers"
do = "drop"
args = { entry = "Falcon Engineering #66" }
expect = ["row(race.entries, 'entry', 'Falcon Engineering #66').status == 'no_data'"]
timeout = "20s"
caption = "Falcon Engineering #66 loses its connection"
focus = ["race_control", "viewer"]

[[step]]
id = "shot_dc_suspected_1"
at = "after:dc_drop+3s"
role = "api"
do = "get"
args = { path = "/status" }
expect = ["relay.up"]
shot = { name = "dc-suspected-1", role = "race_control", element = ".area[data-area=\"race\"] .tbl" }

[[step]]
id = "dc_event"
at = "after:shot_dc_suspected_1+5s"
role = "api"
do = "get"
args = { path = "/drivers/race/recording" }
expect = ["row(relay.get('/drivers/race/recording').events, 'entry', 'Falcon Engineering #66').state == 'suspected'"]
timeout = "20s"

[[step]]
id = "dc_suspected"
at = "after:dc_event"
role = "race_control"
do = "hold"
args = { seconds = 8 }
caption = "The desk lists Falcon Engineering #66 as a suspected disconnect"
focus = ["race_control", "viewer"]

[[step]]
id = "shot_dc_suspected_2"
at = "after:dc_suspected+3s"
role = "api"
do = "get"
args = { path = "/status" }
expect = ["relay.up"]
shot = { name = "dc-suspected-2", role = "race_control", element = ".area[data-area=\"race\"] .tbl >> nth=1" }

[[step]]
id = "shot_dc_tower_1"
at = "after:shot_dc_suspected_2+3s"
role = "api"
do = "get"
args = { path = "/status" }
expect = ["relay.up"]
shot = { name = "dc-tower-1", role = "page:overlay", element = "#drivers-tower" }

[[step]]
id = "dc_standings"
at = "after:shot_dc_tower_1"
role = "race_control"
do = "show_standings"
args = { entry = "Falcon Engineering #66", seconds = 8 }
soft = ["result('dc_standings').rows == 14"]
timeout = "20s"
caption = "Race Control opens the standings of 10 s before the last packet of Falcon Engineering #66"
focus = ["race_control"]

[[step]]
id = "dc_confirm"
at = "after:dc_standings"
role = "race_control"
do = "confirm_dc"
args = { entry = "Falcon Engineering #66" }
expect = ["row(race.entries, 'entry', 'Falcon Engineering #66').status == 'dc'"]
timeout = "15s"
caption = "Race Control confirms the disconnect of Falcon Engineering #66"

[[step]]
id = "desk_events"
at = "after:dc_confirm"
role = "race_control"
do = "view"
args = { area = "race" }
shot = { name = "dc-decided-1", role = "race_control", element = ".area[data-area=\"race\"] .tbl >> nth=1" }

[[step]]
id = "shot_dc_tower_2"
at = "after:desk_events+3s"
role = "api"
do = "get"
args = { path = "/status" }
expect = ["relay.up"]
shot = { name = "dc-tower-2", role = "page:overlay", element = "#drivers-tower" }

[[step]]
id = "dc_public"
at = "after:shot_dc_tower_2"
role = "viewer"
do = "read"
args = { cars = 14 }
expect = ["page('viewer').cars >= 14",
          "len(having(page('viewer').rows, 'Falcon', 'DC')) == 1"]
timeout = "30s"
shot = "dc-onair-3"
caption = "The public timing shows Falcon Engineering #66 as DC"
focus = ["viewer", "race_control"]

[[step]]
id = "dc_mark"
at = "after:dc_public"
role = "race_control"
do = "rejoin"
args = { entry = "Falcon Engineering #66" }
expect = ["row(race.entries, 'entry', 'Falcon Engineering #66').rejoin"]
timeout = "10s"
caption = "Race Control marks Falcon Engineering #66 for a rejoin"

[[step]]
id = "lap4"
at = "after:dc_mark"
role = "api"
do = "get"
args = { path = "/drivers/race" }
expect = ["race.lap.leader >= 4"]
timeout = "12m"

[[step]]
id = "est_drop"
at = "after:lap4"
role = "drivers"
do = "drop"
args = { entry = "Harbor Lights #88" }
expect = ["row(race.entries, 'entry', 'Harbor Lights #88').status == 'no_data'"]
timeout = "20s"
caption = "The sender of Harbor Lights #88 stops"
focus = ["race_control", "viewer"]

[[step]]
id = "shot_est_onair_1"
at = "after:est_drop+3s"
role = "api"
do = "get"
args = { path = "/status" }
expect = ["relay.up"]
shot = { name = "est-onair-1", role = "page:overlay", element = "#drivers-tower" }

[[step]]
id = "estimate"
at = "after:shot_est_onair_1"
role = "race_control"
do = "estimate"
