caption = "The stint 3 driver of Lakeside Racing #14 registers on the invite page"
focus = ["driver", "race_control"]

[[step]]
id = "swap2_approve"
at = "after:swap2_driver"
role = "race_control"
do = "approve_driver"
args = { name = "Driver 14-3" }
timeout = "20s"
