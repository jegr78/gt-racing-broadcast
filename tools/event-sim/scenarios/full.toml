role = "api"
do = "get"
args = { path = "/status" }
expect = ["relay.up"]
shot = { name = "redflag-1", role = "page:overlay" }

[[step]]
id = "shot_redflag_2"
at = "after:shot_redflag_1+3s"
role = "api"
do = "get"
args = { path = "/status" }
expect = ["relay.up"]
shot = { name = "redflag-2", role = "viewer" }

[[step]]
id = "take_plan"
at = "after:shot_redflag_2"
role = "race_control"
do = "take_plan"
args = { buffer = 1 }
expect = ["row(race.stints, 'stint', 'Stint 2').laps == result('take_plan').laps"]
timeout = "10s"
caption = "Race Control takes the restart plan: the restart lobby runs the laps left in the stint"
focus = ["race_control"]

[[step]]
id = "to_box"
at = "after:take_plan"
role = "drivers"
do = "box"
expect = ["page('drivers').standing == 14"]
timeout = "4m"
caption = "The cars return to the box"
focus = ["race_control", "program"]

[[step]]
id = "restart_lobby"
at = "after:to_box"
role = "drivers"
do = "lobby"
args = { stint = 2 }
caption = "The drivers join the restart lobby"
focus = ["race_control", "program"]

[[step]]
id = "restart_released"
at = "after:restart_lobby+5s"
role = "race_control"
do = "release"
expect = ["not race.red_flag",
          "relay.get('/setup/data').fields.racecontrol != 'Red Flag - Race Suspended'"]
timeout = "15s"
shot = { name = "restart-2", role = "race_control", element = ".area[data-area=\"race\"] .tbl" }
caption = "Race Control releases the restart"
focus = ["race_control", "program"]

[[step]]
id = "leave_box"
at = "after:restart_released"
role = "drivers"
do = "release"
args = { gaps = "${before_red.entries}" }
expect = ["page('drivers').driving == 14"]
timeout = "4m"
caption = "The cars leave the box with the gaps they had before the flag"
focus = ["program", "viewer"]

# The release of 14 cars takes 37-39 s and the simulated paces differ by up to about
# 4.7 %, so gaps move about 2 s by themselves; red-flag checks the restart within 1 s.
# The paces also change the order, not only cars closer than the drivers' 0.2 s tick:
# the exact order is soft.

[[step]]
id = "kept"
at = "after:leave_box+3s"
role = "api"
do = "get"
args = { path = "/drivers/race" }
expect = ["drift(result('before_red').entries, race.entries, 'gap_s') <= 3"]
soft = ["pluck(race.entries, 'entry') == pluck(result('before_red').entries, 'entry')"]
timeout = "5s"

[[step]]
id = "program_back"
at = "after:kept"
role = "api"
do = "get"
args = { path = "/status" }
expect = ["'comms2' in obs.program_channels"]
timeout = "90s"

[[step]]
id = "shot_restart_3"
at = "after:program_back+3s"
role = "api"
do = "get"
args = { path = "/status" }
expect = ["relay.up"]
shot = { name = "restart-3", role = "race_control", element = ".area[data-area=\"race\"] .tbl" }

[[step]]
id = "shot_restart_tower_1"
at = "after:shot_restart_3+3s"
role = "api"
do = "get"
args = { path = "/status" }
expect = ["relay.up"]
shot = { name = "restart-tower-1", role = "page:overlay", element = "#drivers-tower" }

[[step]]
id = "pit2"
at = "after:shot_restart_tower_1"
role = "drivers"
do = "pit"
args = { entry = "Blue Harbor Racing #22", seconds = 20 }
caption = "Blue Harbor Racing #22 comes in for a pit stop"
focus = ["race_control", "viewer"]

[[step]]
id = "in_pits2"
at = "after:pit2"
role = "api"
do = "get"
args = { path = "/drivers/race" }
expect = ["row(race.entries, 'entry', 'Blue Harbor Racing #22').status == 'box'"]
timeout = "5m"

[[step]]
id = "out_of_pits2"
at = "after:in_pits2"
role = "api"
do = "get"
args = { path = "/drivers/race" }
expect = ["row(race.entries, 'entry', 'Blue Harbor Racing #22').status == 'racing'"]
timeout = "2m"

[[step]]
id = "compound2"
at = "after:out_of_pits2"
role = "race_control"
do = "compound"
args = { entry = "Blue Harbor Racing #22", code = "RH" }
expect = ["race.compounds['Blue Harbor Racing #22'].code == 'RH'"]
timeout = "15s"
caption = "Race Control sets the new tyre compound of Blue Harbor Racing #22"

[[step]]
id = "desk_race_back2"
at = "after:compound2"
role = "race_control"
do = "view"
args = { area = "race" }

[[step]]
id = "late2"
at = "after:desk_race_back2"
role = "api"
do = "get"
args = { path = "/drivers/race" }
expect = ["race.lobby_lap >= result('take_plan').laps - 2"]
timeout = "12m"

[[step]]
id = "swap2_driver"
at = "after:late2"
role = "drivers"
do = "register_stint"
args = { stint = 3 }
expect = ["result('swap2_driver').registered == 14"]
timeout = "20s"
chapter = "Driver swap 2"
caption = "The stint 3 drivers register for their lobby"
focus = ["race_control", "program"]

[[step]]
id = "swap2_waiting"
at = "after:swap2_driver"
role = "race_control"
do = "view"
args = { area = "drivers" }
expect = ["page('race_control').waiting == 14"]
timeout = "20s"

[[step]]
id = "swap2_approve"
at = "after:swap2_waiting"
role = "race_control"
do = "approve_all"
expect = ["result('swap2_approve').approved == 14", "page('race_control').waiting == 0"]
timeout = "20s"
caption = "Race Control approves the stint 3 drivers with Approve all"
focus = ["race_control"]

[[step]]
id = "swap2_desk"
at = "after:swap2_approve"
role = "race_control"
do = "view"
args = { area = "race" }

[[step]]
id = "warm3"
at = "after:swap2_desk"
role = "director"
do = "view"
args = { area = "handover" }
expect = ["relay.status.handover_next.stint == 3",
          "relay.status.feeds[relay.status.handover_next.feed].state == 'serving'"]
timeout = "90s"
caption = "The feed of stint 3 runs warm: the Handover area shows it ready"
focus = ["director"]

[[step]]
id = "open3"
at = "after:warm3"
role = "drivers"
do = "next_lobby"
args = { stint = 3 }
expect = ["page('drivers').next_waiting > 0"]
caption = "The stint 3 lobby opens for the last laps of the restart lobby: the stint 3 drivers start there, drive lap 1 and wait in the box"
focus = ["race_control", "program"]

[[step]]
id = "box3"
at = "after:open3"
role = "drivers"
do = "box"
args = { laps = "${take_plan.laps}" }
caption = "The cars come into the box at the end of the restart lobby's second to last lap"
focus = ["race_control", "program"]

[[step]]
id = "cockpit3_back"
at = "after:box3"
role = "commentator:Comms 3"
do = "open"
expect = ["not page('commentator:Comms 3').on_air"]
timeout = "20s"

[[step]]
id = "leader_box3"
at = "after:cockpit3_back"
role = "api"
do = "get"
args = { path = "/drivers/race" }
expect = ["race.entries[0].status == 'box'"]
timeout = "4m"

[[step]]
id = "split3"
at = "after:leader_box3"
role = "director"
do = "scene"
args = { scene = "Split" }
expect = ["obs.scene == 'Splitscreen'"]
timeout = "20s"
caption = "The race leader is in the box: the director puts the splitscreen on program"
focus = ["program", "director"]

# NEXT right after the splitscreen opens the relay's change window. A next-lobby car that
# left on its go signal before it takes over when the window opens.
[[step]]
id = "next3"
at = "after:split3"
role = "director"
do = "next"
expect = ["page('commentator:Comms 3').on_air"]
timeout = "90s"
caption = "The director switches to stint 3: Comms 3 goes on air"
focus = ["director", "program", "commentator:Comms 2", "commentator:Comms 3"]

[[step]]
id = "change3"
at = "after:next3"
role = "drivers"
do = "change"
caption = "Each stint 3 driver leaves the box once the team's stint 2 car stands there"
focus = ["program", "race_control"]

[[step]]
id = "changed3"
at = "after:change3"
role = "api"
do = "get"
args = { path = "/drivers/race" }
expect = ["page('drivers').next_waiting == 0"]
timeout = "5m"
caption = "The cars leave the box one by one with their stint 3 drivers as their teams' cars arrive"
focus = ["program", "viewer"]

[[step]]
id = "stint3_cut"
at = "after:changed3"
role = "director"
do = "scene"
args = { scene = "Stint" }
expect = ["'comms3' in obs.program_channels",
          "'comms2' not in obs.program_channels"]
timeout = "90s"
caption = "The director cuts back to the stint: Comms 3 alone on program"
focus = ["program", "director"]

[[step]]
id = "compounds3"
at = "after:stint3_cut"
role = "race_control"
do = "compounds"
args = { code = "RS", skip = ["Ion Racing #9"] }
expect = ["race.compounds['Apex Works #11'].code == 'RS'"]
soft = ["len(result('compounds3').changed) == 13"]
timeout = "15s"
caption = "Race Control enters the compounds the stint 3 drivers start on"

[[step]]
id = "desk_stint3"
at = "after:compounds3"
role = "race_control"
do = "view"
args = { area = "race" }

[[step]]
id = "cockpit2_off"
at = "after:desk_stint3"
role = "commentator:Comms 2"
do = "close"

[[step]]
id = "stint3"
at = "after:cockpit2_off"
role = "api"
do = "get"
args = { path = "/drivers/race" }
expect = ["row(race.entries, 'entry', 'Apex Works #11').driver == 'Driver 11-3'",
          "unchanged(result('late2').entries, race.entries, 'driver') in [[], ['Ion Racing #9']]",
          "relay.status.timer.remaining_s > 0"]
timeout = "60s"

# The final lobby runs its 5 laps: Race Control calls the final lap as the leader starts it.
[[step]]
id = "last_lap"
at = "after:stint3"
role = "api"
do = "get"
args = { path = "/drivers/race" }
expect = ["race.lobby_lap >= 5"]
timeout = "15m"

[[step]]
id = "final_lap"
at = "after:last_lap"
role = "race_control"
do = "final_lap"
expect = ["race.state in ['final_lap', 'finishing', 'finished']",
          "relay.get('/setup/data').fields.racecontrol == 'Final Lap'"]
timeout = "30s"
chapter = "The finish"
caption = "Race Control calls the final lap, and Final Lap shows on the HUD with it"
focus = ["race_control", "viewer"]

[[step]]
id = "shot_finallap_2"
at = "after:final_lap+3s"
role = "api"
do = "get"
args = { path = "/status" }
expect = ["relay.up"]
shot = { name = "finallap-2", role = "page:overlay" }

[[step]]
id = "desk_final"
at = "after:shot_finallap_2"
role = "race_control"
do = "view"
args = { area = "race" }
shot = { name = "finallap-1", role = "race_control", element = ".area[data-area=\"race\"] .tbl" }

[[step]]
id = "flag"
at = "after:desk_final"
role = "api"
do = "get"
args = { path = "/drivers/race" }
expect = ["race.state == 'finishing' or race.state == 'finished'"]
soft = ["relay.status.timer.remaining_s == 0"]
timeout = "5m"

[[step]]
id = "chequer"
at = "after:flag"
role = "drivers"
do = "chequer"
expect = ["result('chequer').finished"]
caption = "Each car stops sending as it crosses the finish line and leaves the track map"
focus = ["race_control", "program"]

[[step]]
id = "rc_flag"
at = "after:chequer"
role = "api"
do = "get"
args = { path = "/drivers/race" }
expect = ["relay.get('/setup/data').fields.racecontrol == 'Chequered Flag'"]
timeout = "20s"
caption = "With the leader's flag, Final Lap turns into Chequered Flag by itself"
focus = ["program", "race_control"]

[[step]]
id = "shot_chequered_1"
at = "after:rc_flag+3s"
role = "api"
do = "get"
args = { path = "/status" }
expect = ["relay.up"]
shot = { name = "chequered-1", role = "page:overlay" }

[[step]]
id = "shot_chequered_2"
at = "after:shot_chequered_1+3s"
role = "api"
do = "get"
args = { path = "/status" }
expect = ["relay.up"]
shot = { name = "chequered-2", role = "viewer" }

[[step]]
id = "countdown_end"
at = "after:chequer"
role = "drivers"
do = "stop"
expect = ["relay.get('/drivers/race').state == 'finishing'"]
caption = "GT7's finish countdown ends the session: the cars still on their last lap stop sending"
focus = ["race_control", "viewer"]

[[step]]
id = "finish_due"
at = "after:countdown_end"
role = "api"
do = "get"
args = { path = "/drivers/race" }
expect = ["race.finish_due", "race.state == 'finishing'"]
timeout = "60s"

[[step]]
id = "desk_finish_due"
at = "after:finish_due"
role = "race_control"
do = "view"
args = { area = "race" }
shot = { name = "finish-due-1", role = "race_control" }
caption = "After 30 s without data the desk reminds Race Control to press Finish"
focus = ["race_control"]

[[step]]
id = "rc_finish"
at = "after:desk_finish_due+3s"
role = "race_control"
do = "finish"
expect = ["relay.get('/drivers/race').state == 'finished'",
          "not relay.get('/drivers/race').finish_due"]
timeout = "30s"
caption = "Race Control presses Finish: the cars short of the flag keep their gaps where their data stopped"
focus = ["race_control", "program"]

[[step]]
id = "finished"
at = "after:rc_finish"
role = "api"
do = "get"
args = { path = "/drivers/race" }
expect = ["race.state == 'finished'",
          "row(race.entries, 'entry', 'Ion Racing #9').status == 'retired'"]
timeout = "5m"

[[step]]
id = "shot_finished_1"
at = "after:finished+3s"
role = "api"
do = "get"
args = { path = "/status" }
expect = ["relay.up"]
shot = { name = "finished-1", role = "page:overlay" }

[[step]]
id = "shot_finished_2"
at = "after:shot_finished_1+3s"
role = "api"
do = "get"
args = { path = "/status" }
expect = ["relay.up"]
shot = { name = "finished-2", role = "viewer" }

[[step]]
id = "fastest_public"
at = "after:shot_finished_2"
role = "viewer"
do = "read"
expect = ["'Fastest lap' in page('viewer').fastest"]
timeout = "20s"
caption = "The public timing shows the result and the fastest lap"
focus = ["viewer", "program"]

[[step]]
id = "shot_new_cockpit_finished"
at = "after:fastest_public+3s"
role = "api"
do = "get"
args = { path = "/status" }
expect = ["relay.up"]
shot = { name = "new-cockpit-finished", role = "commentator:Comms 3", element = "#timingCard" }

[[step]]
id = "chat_finish"
at = "after:shot_new_cockpit_finished+6s"
role = "commentator:Comms 3"
do = "chat"
args = { text = "Thanks everyone, that was a great race." }
caption = "Comms 3 thanks the crew in the crew chat"
focus = ["commentator:Comms 3", "director"]

[[step]]
id = "chequered"
at = "after:chat_finish"
role = "drivers"
do = "stop"
caption = "The drivers stop after the chequered flag"
focus = ["program", "viewer"]

[[step]]
id = "outro"
at = "after:chequered"
role = "director"
do = "play"
args = { media = "outro" }
chapter = "Off air"
caption = "The director plays the outro"
focus = ["program", "director"]

[[step]]
id = "off_air"
at = "after:outro"
role = "director"
do = "end_part"
expect = ["not obs.streaming", "not relay.up"]
timeout = "60s"
caption = "The director ends the broadcast, and the event stops with it"
focus = ["director", "program"]
