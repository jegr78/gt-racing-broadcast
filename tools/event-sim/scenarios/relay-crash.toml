# Relay crash: three stints in three lobbies, one commentator each. Part 1 streams and
# stint 2 is on air with Comms 2 when the relay dies without a stop. OBS keeps streaming.
# The producer presses a plain Start event, which leaves the live program alone:
# the relay comes back on stint 2 with the same driver codes, the drivers' telemetry counts
# again without a new approval, Feed A auto-arms and Comms 2 is back on program.
# Stint 3 then runs to the finish.
description = "Relay killed in stint 2; a plain Start event resumes the stint and the driver codes."
max_minutes = 14

[event]
stints = 3
track = "6e378b"
track_length_m = 1200
cars = 4
seed = 7
parts = 2

[[event.commentators]]
name = "Comms 1"
channel = "comms1"
scheduled = true

[[event.commentators]]
name = "Comms 2"
channel = "comms2"
scheduled = true

[[event.commentators]]
name = "Comms 3"
channel = "comms3"
scheduled = true

[[step]]
id = "relay_up"
role = "api"
do = "get"
args = { path = "/status" }
expect = ["relay.up"]

[[step]]
id = "track"
at = "after:relay_up"
role = "producer"
do = "pick_track"

[[step]]
id = "race_settings"
at = "after:track"
role = "producer"
do = "race_settings"
args = { formation = false, finish_mode = "laps", laps = 2 }
expect = ["race.settings.lap_count == 2"]

[[step]]
id = "start_event"
at = "after:race_settings"
role = "producer"
do = "start_event"
expect = ["obs.scene == 'Standby'", "relay.up"]

[[step]]
id = "warm_a"
at = "after:start_event"
role = "director"
do = "view"
args = { area = "handover" }
expect = ["relay.status.feeds.A.state == 'serving'"]
timeout = "90s"

[[step]]
id = "stint1_on_air"
at = "after:warm_a"
role = "director"
do = "scene"
args = { scene = "Stint" }
expect = ["'comms1' in obs.program_channels"]
timeout = "90s"

[[step]]
id = "go_live"
at = "after:stint1_on_air"
role = "director"
do = "start_part"
expect = ["obs.streaming"]

[[step]]
id = "cockpit2"
at = "after:go_live"
role = "commentator:Comms 2"
do = "open"
expect = ["not page('commentator:Comms 2').on_air"]
timeout = "15s"

[[step]]
id = "register"
at = "after:cockpit2"
role = "drivers"
do = "register"
expect = ["result('register').registered == 12"]

[[step]]
id = "approve_drivers"
at = "after:register"
role = "race_control"
do = "approve_drivers"
expect = ["result('approve_drivers').approved == 12"]

[[step]]
id = "green"
at = "after:approve_drivers"
role = "drivers"
do = "start"
expect = ["race.state == 'racing'"]
timeout = "60s"

[[step]]
id = "lap2"
at = "after:green"
role = "api"
do = "get"
args = { path = "/drivers/race" }
expect = ["race.lap.leader >= 2"]
timeout = "3m"

[[step]]
id = "box1"
at = "after:lap2"
role = "drivers"
do = "box"
expect = ["page('drivers').standing == 4"]
timeout = "90s"

[[step]]
id = "warm_b"
at = "after:box1"
role = "director"
do = "view"
args = { area = "handover" }
expect = ["relay.status.handover_next.stint == 2",
          "relay.status.feeds[relay.status.handover_next.feed].state == 'serving'"]
timeout = "90s"

[[step]]
id = "next2"
at = "after:warm_b"
role = "director"
do = "next"
expect = ["'comms2' in obs.program_channels", "'comms1' not in obs.program_channels",
          "page('commentator:Comms 2').on_air"]
timeout = "90s"

[[step]]
id = "lobby2"
at = "after:next2"
role = "drivers"
do = "lobby"
args = { stint = 2 }

[[step]]
id = "release2"
at = "after:lobby2+5s"
role = "drivers"
do = "release"
expect = ["page('drivers').driving == 4"]
timeout = "60s"

[[step]]
id = "stint2_lap"
at = "after:release2+30s"
role = "api"
do = "get"
args = { path = "/drivers/race" }
expect = ["row(race.entries, 'entry', 'Apex Works #11').driver == 'Driver 11-2'",
          "row(race.entries, 'entry', 'Apex Works #11').pit_stops == 1",
          "len(result('stint2_lap').entries) == 4"]

[[step]]
id = "before_crash"
at = "after:stint2_lap"
role = "api"
do = "get"
args = { path = "/status" }
expect = ["result('before_crash').live.stint == 2"]

[[step]]
id = "crash"
at = "after:before_crash"
role = "relay"
do = "kill"
expect = ["not relay.up"]
timeout = "15s"

# A plain Start event: no stint, no flags. The event was never stopped, so it continues.
[[step]]
id = "restart_event"
at = "after:crash+5s"
role = "producer"
do = "start_event"
expect = ["relay.up", "relay.status.live.stint == 2", "relay.status.mode == 'race'",
          "obs.streaming", "obs.scene == 'Stint'"]
timeout = "30s"

# The relay comes back with stint 2 on Feed A, which auto-arms and pulls it again.
[[step]]
id = "stint2_back"
at = "after:restart_event"
role = "api"
do = "get"
args = { path = "/drivers/race" }
expect = ["'comms2' in obs.program_channels", "'comms3' not in obs.program_channels",
          "page('commentator:Comms 2').on_air"]
timeout = "90s"

# The same codes count again: no driver registers or waits for approval, and the race
# goes on from the distance it had.
[[step]]
id = "codes_kept"
at = "after:stint2_back"
role = "api"
do = "get"
args = { path = "/drivers/race" }
expect = ["page('race_control').waiting == 0", "len(race.entries) == 4",
          "race.lap.leader > result('stint2_lap').lap.leader",
          "pluck(race.entries, 'status') == ['racing', 'racing', 'racing', 'racing']"]
timeout = "90s"

[[step]]
id = "no_requests"
at = "after:codes_kept"
role = "api"
do = "get"
args = { path = "/drivers/requests" }
expect = ["'pending' not in pluck(result('no_requests').requests, 'status')"]

[[step]]
id = "box2"
at = "after:no_requests"
role = "drivers"
do = "box"
expect = ["page('drivers').standing == 4"]
timeout = "90s"

[[step]]
id = "warm3"
at = "after:box2"
role = "director"
do = "view"
args = { area = "handover" }
expect = ["relay.status.handover_next.stint == 3",
          "relay.status.feeds[relay.status.handover_next.feed].state == 'serving'"]
timeout = "90s"

[[step]]
id = "next3"
at = "after:warm3"
role = "director"
do = "next"
expect = ["'comms3' in obs.program_channels", "'comms2' not in obs.program_channels"]
timeout = "90s"

[[step]]
id = "lobby3"
at = "after:next3"
role = "drivers"
do = "lobby"
args = { stint = 3 }

[[step]]
id = "release3"
at = "after:lobby3+5s"
role = "drivers"
do = "release"
expect = ["page('drivers').driving == 4"]
timeout = "60s"

[[step]]
id = "finished"
at = "after:release3"
role = "api"
do = "get"
args = { path = "/drivers/race" }
expect = ["race.state == 'finished'", "row(race.entries, 'entry', 'Apex Works #11').driver == 'Driver 11-3'"]
timeout = "3m"

[[step]]
id = "chequered"
at = "after:finished"
role = "drivers"
do = "stop"

[[step]]
id = "off_air"
at = "after:chequered"
role = "director"
do = "end_part"
expect = ["not obs.streaming"]

[[step]]
id = "stop_event"
at = "after:off_air"
role = "producer"
do = "stop_event"
expect = ["not relay.up"]
timeout = "30s"
