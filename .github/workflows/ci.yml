name: CI

# Test gate. Runs the stdlib test suite + build self-verify (tokenization,
# blanked password, no secrets shipped). Two orthogonal axes, NOT a full cross
# product: the Python-version axis (3.12/3.13) runs on ubuntu only (fast/free,
# catches version-specific stdlib drift), while the OS axis (Windows/macOS,
# the binary ships for all three) runs on the pinned ship version (3.12) only,
# catching OS-specific path/process bugs (#97). macOS runners are the slow,
# scarce ones, so they get exactly one job, not three. NB: the matrix job names
# below ("test (<os>, <ver>)") are the ruleset's required status checks: if you
# change a combo, update Protect main's required checks to match or PRs deadlock.
on:
  push:
    branches: [main, "epic/**"]
  pull_request:
    branches: [main, "epic/**"]   # gate sub-PRs targeting a long-lived epic branch

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  lint:
    # Fast mechanical gate (ruff.toml mirrors the CodeQL alert classes:
    # unclosed files, mixed returns, unused imports, bugbear). CodeQL stays
    # the deep security scanner; this catches the rest before review.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89  # v4.1.0
        with:
          version: "0.17.0"    # pinned: new ruff rules must not break CI silently

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        python-version: ["3.12", "3.13"]
        # Full version sweep on ubuntu only; the slow Windows/macOS runners run
        # just the pinned ship version (3.12). 4 jobs instead of a 6-job cross
        # product (and one macOS job, not three). exclude (not include) keeps the
        # job names as "test (<os>, <ver>)" so the ruleset's required checks match.
        exclude:
          - os: windows-latest
            python-version: "3.13"
          - os: macos-latest
            python-version: "3.13"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run test suite (stdlib, each file is a runnable script)
        run: python tools/run-tests.py

  build:
    # Build self-verify (tokenization, blanked password, no secrets shipped, no
    # shell scripts). OS-independent: it asserts the assembled dist/ contents,
    # not runtime behaviour: so one ubuntu job suffices instead of re-running it
    # inside every test-matrix job. A required check (gates merges like the tests).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - name: Build distributable + self-verify (tokenization, blanked password, no secrets)
        run: python tools/build.py

  binary-smoke:
    timeout-minutes: 15
    # CI must exercise everything the release pipeline exercises: release.yml
    # builds the PyInstaller binary and runs the build-binary smoke test, so a
    # PR that breaks either (e.g. a removed CLI flag still passed by the smoke)
    # must go red here, not at the v* tag. This keeps the established Linux smoke;
    # native-package additionally exercises Windows/macOS frozen coaching.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - name: Install PyInstaller
        run: python -m pip install pyinstaller
      - name: Build + smoke-test the binary (same step as release.yml)
        run: python tools/build-binary.py --version ci-smoke

  native-package:
    timeout-minutes: 15
    # Exercise the actual frozen relay and private coaching journal on the other
    # producer OSes too. binary-smoke and e2e-binary cover Linux; these runs keep
    # Windows/macOS packaging evidence separate from their stdlib test suites.
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - name: Install PyInstaller
        run: python -m pip install pyinstaller
      - name: Build and exercise the frozen relay
        run: python tools/e2e.py --build --coach-only

  e2e:
    timeout-minutes: 15
    # Integration outer loop: stand up the relay + Control Center from src/ and
    # assert the live HTTP surface (cockpit auth gating, tally, chat round-trip,
    # /api/console/status, …): the end-to-end behaviour run-tests.py's unit
    # suite can't cover. Synthetic mode only: no real Sheet/cookies/OBS/Tailscale
    # and no yt-dlp/streamlink/ffmpeg/deno (the relay's feed pulls are best-effort
    # daemon threads, so the control server still comes up). Stdlib only. NO
    # --playwright, so the optional rendered checks always skip here. One OS is
    # enough; the synthetic surface is OS-independent.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - name: Run the synthetic e2e harness (relay + Control Center bring-up)
        run: python tools/e2e.py
      - name: Growing recording replay through the Engineer desk
        run: python tools/engineer-replay.py --check

  visual:
    timeout-minutes: 15
    # Visual acceptance run: renders Control Center, Director Panel, cockpit and
    # Race Control in Chromium and fails on a layout-rule finding. The stdlib e2e
    # job above stays Playwright-free.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - name: Install Playwright + Chromium
        run: |
          python -m pip install playwright==1.63.0
          python -m playwright install --with-deps chromium
      - name: Run the visual acceptance run
        run: python tools/e2e.py --visual --report visual-report
      - name: Verify audience widgets and live scene values
        run: python tools/e2e-audience.py
      - name: Verify local Telemetry workspace and profile isolation
        run: python tools/e2e-telemetry-workspace.py
      - name: Verify the optional analysis browser workflow
        run: python tools/e2e-ai.py
      - name: Recording selection browser workflow
        run: python tools/e2e-recording-selection.py
      - name: Race Engineer access browser workflow
        run: python tools/e2e-engineer.py
      - name: Race Engineer analysis desk browser workflow
        run: python tools/e2e-engineer-desk.py
      - name: Race Engineer display cleanup browser workflow
        run: python tools/e2e-engineer-display.py
      - name: Race Engineer approved layout browser workflow
        run: python tools/e2e-engineer-layout.py
      - name: Operator telemetry replay browser workflow
        run: python tools/e2e-telemetry-replay.py
      - name: Cached asset alias browser workflow
        run: python tools/e2e-asset-aliases.py
      - name: Scene builder aspect ratios and saved layouts
        run: python tools/e2e-scene-layouts.py
      - name: Splitscreen builder geometry
        run: python tools/e2e-splitscreen.py
      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: visual-report
          path: visual-report/
          if-no-files-found: ignore
