name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:        # dispatched by release-please.yml with --ref <tag>
permissions:
  contents: write
defaults:
  run:
    shell: bash
jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      # A dispatch from a branch would publish a release named after the branch.
      - name: Refuse a ref that is not a v* tag
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: |
          echo "::error::release.yml publishes v* tags only; dispatch it with --ref <tag> (got $GITHUB_REF)"
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Create the GitHub release unless release-please already did
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists"
          else
            gh release create "$TAG" --generate-notes
          fi
  build:
    needs: create-release
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: racecast-windows.zip
            sender: dist/bin/racecast-sender.exe
            sender_asset: racecast-sender-windows.exe
            built: dist/bin/racecast.exe
            binary: racecast.exe
            built_ui: dist/bin/racecast-ui.exe
            binary_ui: racecast-ui.exe
          - os: macos-latest
            asset: racecast-macos.tar.gz
            sender: dist/bin/racecast-sender
            sender_asset: racecast-sender-macos
            built: dist/bin/racecast
            binary: racecast
            built_ui: dist/bin/racecast-ui.app
            binary_ui: racecast-ui.app
          - os: ubuntu-latest
            asset: racecast-linux.tar.gz
            built: dist/bin/racecast
            binary: racecast
            built_ui: dist/bin/racecast-ui
            binary_ui: racecast-ui
          - os: ubuntu-24.04-arm        # GitHub-hosted ARM64 Linux runner
            asset: racecast-linux-arm64.tar.gz
            built: dist/bin/racecast
            binary: racecast
            built_ui: dist/bin/racecast-ui
            binary_ui: racecast-ui
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - name: Run test suite
        run: python tools/run-tests.py
      - name: Install PyInstaller
        run: python -m pip install pyinstaller
      - name: Build + smoke-test the binary
        run: python tools/build-binary.py --version "${{ github.ref_name }}"
      - name: Package the release asset (binaries + .env.example)
        run: |
          mkdir staging
          cp -R "${{ matrix.built }}" "staging/${{ matrix.binary }}"
          cp -R "${{ matrix.built_ui }}" "staging/${{ matrix.binary_ui }}"
          cp .env.example LICENSE staging/
          cd staging
          case "${{ matrix.asset }}" in
            *.zip)    python -m zipfile -c "../${{ matrix.asset }}" "${{ matrix.binary }}" "${{ matrix.binary_ui }}" .env.example LICENSE ;;
            *.tar.gz) tar czf "../${{ matrix.asset }}" "${{ matrix.binary }}" "${{ matrix.binary_ui }}" .env.example LICENSE ;;
            *)        echo "Unknown asset format: ${{ matrix.asset }}"; exit 1 ;;
          esac
      - name: Upload release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.ref_name }}" "${{ matrix.asset }}" --clobber
      - name: Upload the driver sender program (Windows, macOS)
        if: matrix.sender_asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp "${{ matrix.sender }}" "${{ matrix.sender_asset }}"
          gh release upload "${{ github.ref_name }}" "${{ matrix.sender_asset }}" --clobber
